}

function renderMap() {
  const wrap = el("div", "page");
  const left = HOURS - S.hours;
  const head = el("div", "maphead");
  head.appendChild(el("h2", null, "🗺️ The Island Map"));
  const clock = el("div", "clock");
  clock.appendChild(el("span", null, "🌙"));
  const pips = el("div", "pips");
  for (let i = 0; i < HOURS; i++) { const p = el("div", "pip" + (i < S.hours ? " gone" : ""), i < S.hours ? "" : "⏳"); pips.appendChild(p); }
  clock.appendChild(pips);
  clock.appendChild(el("span", null, left === 1 ? "1 hour to midnight!" : left + " hours to midnight"));
  head.appendChild(clock);
  const purse = el("div", "purse"); purse.innerHTML = P8(eightTotal()); purse.title = "Pieces of eight";
  head.appendChild(purse);
  wrap.appendChild(head);

  const mw = el("div", "mapwrap");
  mw.innerHTML = mapSVG();
  PLACES.forEach(p => {
    const done = S.visited.includes(p.id);
    const b = el("button", "loc" + (done ? " done" : "")); b.type = "button";
    b.style.left = p.x + "%"; b.style.top = p.y + "%";
    b.appendChild(el("span", "pin", p.em)); b.appendChild(el("span", "tag", p.name));
    b.setAttribute("aria-label", p.name + (done ? " (already visited)" : ""));
    if (!done) b.addEventListener("click", () => enterPlace(p));
    mw.appendChild(b);
  });
  const here = S.lastPlace ? PLACES.find(p => p.id === S.lastPlace) : PORT;
  const boat = el("div", "boat", "🚣"); boat.style.left = here.x + "%"; boat.style.top = (here.y + 9) + "%";
  mw.appendChild(boat);
  wrap.appendChild(mw);

  const tip = el("p", "maptip");
  const tipId = S.visited.length === 0 ? "map-start" : left === 1 ? "map-last" : "map-middle";
  const tipText = MAP_TIPS[tipId];
  tip.textContent = fill(tipText);
  wrap.appendChild(tip);

  const bag = el("div", "bag");
  bag.appendChild(el("h3", null, "🎒 Your bag"));
  const items = el("div", "items");
  S.items.forEach(k => { const it = el("div", "item"); it.appendChild(el("span", "ie", ITEMS[k].em)); it.appendChild(el("span", null, ITEMS[k].name)); items.appendChild(it); });
  bag.appendChild(items);
  wrap.appendChild(bag);

  const go = el("div", "mapgo");
  const b = el("button", "choice"); b.type = "button";
  b.style.background = "#0d2f2a";
  b.appendChild(el("span", "em", "🏴‍☠️")); b.appendChild(el("span", null, "Sail out to face Grimtide now"));
  b.addEventListener("click", () => goTo("midnight"));
  go.appendChild(b);
  wrap.appendChild(go);
  book.appendChild(wrap);

  const open = PLACES.filter(p => !S.visited.includes(p.id)).map(p => p.name).join(", ");
  say([["n", fill(tipText) + " " + (left === 1 ? "One hour" : left + " hours") + " until midnight. You can go to: " + open + "."]], tipId);
}

/* ---------- Start screen ---------- */
function showStart() {
  clearTimers(); stopSpeech();
  if (game) { game.stop(); game = null; }
  MUSIC.play("shanty");
  S.node = null; S.history = [];
  book.innerHTML = "";
  const wrap = el("div", "page");
  wrap.appendChild(drawPic({ pic: { bg: "ghostShip" }, text: "The ghost ship Rattlebones" }));
  const box = el("div", "start");
  box.appendChild(el("h2", null, "Who dares sail tonight?"));
  box.appendChild(el("p", null, "Break the curse before midnight! There are 7 endings to find."));

  /* Who's telling the story? */
  box.appendChild(el("div", "pickhead", "Who's telling the story?"));
  const pick = el("div", "pick");
  const opts = [
    ["dad", "🎙️", "Captain Dad", "Dad reads the story, starring Sonny and Wylie."],
    ["computer", "🤖", "Robo-Parrot", "The computer reads it. Make your own pirate names."]
  ];
  const cards = {};
  opts.forEach(([k, em, title, sub]) => {
    const c = el("button", "pickcard"); c.type = "button";
    c.setAttribute("aria-pressed", String(S.narrator === k));
    c.appendChild(el("span", "pem", em));
    const t = el("span", "ptxt"); t.appendChild(el("strong", null, title)); t.appendChild(el("span", null, sub)); c.appendChild(t);
    c.addEventListener("click", () => { S.narrator = k; store.set("narrator", k); syncPick(); });
    cards[k] = c; pick.appendChild(c);
  });
  box.appendChild(pick);

  const form = el("form");
  const names = el("div", "names");
  const saved = store.get("names", { a: "", b: "" });
  [["a", "Pirate 1"], ["b", "Pirate 2"]].forEach(([k, label]) => {
    const l = el("label", null, label);
    const inp = document.createElement("input");
    inp.id = "n" + k; inp.maxLength = 12; inp.autocomplete = "off"; inp.value = saved[k] || "";
    inp.placeholder = k === "a" ? "Sam" : "Max";
    inp.addEventListener("input", () => { err.textContent = ""; });
    l.appendChild(inp); names.appendChild(l);
  });
  form.appendChild(names);
  const err = el("p", "err", "");
  form.appendChild(err);
  const go = el("button", "bigbtn", "Make us pirates! 🏴‍☠️"); go.type = "submit";
  form.appendChild(go);
  function syncPick() {
    Object.entries(cards).forEach(([k, c]) => c.setAttribute("aria-pressed", String(S.narrator === k)));
    const dad = S.narrator === "dad";
    names.style.display = dad ? "none" : "";
    go.textContent = dad ? "Ready, Captain Dad! 🎙️" : "Make us pirates! 🏴‍☠️";
    err.textContent = "";
  }
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (S.narrator === "dad") { S.reading = true; store.set("reading", true); syncRead(); loadManifest(); showDadReveal(); return; }
    const ra = document.getElementById("na").value.trim().replace(/[^\p{L}\-' ]/gu, "");
    const rb = document.getElementById("nb").value.trim().replace(/[^\p{L}\-' ]/gu, "");
    if (!ra || !rb) { err.textContent = "Both pirates need a name!"; return; }
    store.set("names", { a: ra, b: rb });
    S.roll = 0;
    showReveal(ra, rb);
  });
  box.appendChild(form);
  wrap.appendChild(box);
  book.appendChild(wrap);
  syncPick();
  backBtn.disabled = true;
  if (S.narrator === "computer") say([["n", "Who dares sail tonight? Type your first names, and we'll turn you into proper pirates."]]);
}

function showDadReveal() {
  stopSpeech();
  book.innerHTML = "";
  const wrap = el("div", "page");
  wrap.appendChild(drawPic({ pic: { bg: "harbour", mode: "dusk", parts: ["parrot@250,330,1.2", "kidA:up@110,372,1", "kidB:up@370,374,1"] }, text: "Sonny and Wylie, the new pirate crew" }));
  const box = el("div", "start");
  box.appendChild(el("h2", null, "Arrr! Meet the crew"));
  box.appendChild(el("p", null, "Tonight's cabin kids, ready for trouble!"));
  const rv = el("div", "reveal");
  [["a", "The pirate in blue", GENERIC.a], ["b", "The pirate in orange", GENERIC.b]].forEach(([k, real, full]) => {
    const c = el("div", "pname " + k);
    c.appendChild(el("div", "real", real));
    c.appendChild(el("div", "pirate", full));
    rv.appendChild(c);
  });
  box.appendChild(rv);
  const row = el("div", "row");
  const start = el("button", "bigbtn", "Set sail! ⛵"); start.type = "button";
  start.addEventListener("click", () => { S.a = GENERIC.a; S.b = GENERIC.b; newGame(true); });
  row.appendChild(start);
  box.appendChild(row);
  wrap.appendChild(box);
  book.appendChild(wrap);
  say([["n", WELCOME]], "welcome");
}

function showReveal(ra, rb) {
  stopSpeech();
  const N = makeNames(ra, rb, S.roll);
  book.innerHTML = "";
  const wrap = el("div", "page");
  wrap.appendChild(drawPic({ pic: { bg: "harbour", mode: "dusk", parts: ["parrot@250,330,1.2", "kidA:up@110,372,1", "kidB:up@370,374,1"] }, text: "The new pirate crew" }));
  const box = el("div", "start");
  box.appendChild(el("h2", null, "Arrr! Meet the crew"));
  const rv = el("div", "reveal");
  [["a", ra, N.aFull], ["b", rb, N.bFull]].forEach(([k, real, full]) => {
    const c = el("div", "pname " + k);
    c.appendChild(el("div", "real", cap(real) + " is now..."));
    c.appendChild(el("div", "pirate", full));
    rv.appendChild(c);
  });
  box.appendChild(rv);
  const row = el("div", "row");
  const again = el("button", "bigbtn alt", "🎲 Roll new names"); again.type = "button";
  again.addEventListener("click", () => { S.roll++; showReveal(ra, rb); });
  const start = el("button", "bigbtn", "Set sail! ⛵"); start.type = "button";
  start.addEventListener("click", () => { S.a = N.a; S.b = N.b; store.set("pirates", { a: N.a, b: N.b }); newGame(true); });
  row.appendChild(again); row.appendChild(start);
  box.appendChild(row);
  wrap.appendChild(box);
  book.appendChild(wrap);
  say([["n", cap(ra) + " is now " + N.aFull + ". And " + cap(rb) + " is now " + N.bFull + ". Arrr!"]]);
}

function newGame() {
  S.flags = {}; S.eight = {};
  S.items = []; S.visited = []; S.hours = 0; S.lastPlace = null; S.history = []; S.node = null;
  goTo("intro1", { noHistory: true });
}

function drawShelf() {
  const slots = document.getElementById("slots"); slots.innerHTML = "";
  const info = {}; Object.values(STORY).forEach(p => { if (p.ending) info[p.ending.id] = p.ending; });
  ENDINGS.forEach(id => {
    const got = S.found.includes(id);
    const s = el("div", "slot" + (got ? " found" : ""), got ? info[id].em : "?");
    s.title = got ? info[id].title : "Not found yet";
    slots.appendChild(s);
  });
  document.getElementById("count").textContent = S.found.length + " / " + ENDINGS.length;
}

/* ---------- Toolbar ---------- */
function syncRead() { readBtn.setAttribute("aria-pressed", String(S.reading)); readBtn.textContent = S.reading ? "🔊 Reading" : "🔈 Read to me"; }
readBtn.addEventListener("click", () => {
  S.reading = !S.reading; store.set("reading", S.reading); syncRead();
  if (S.node) render(); else stopSpeech();
});
backBtn.addEventListener("click", () => {
  const prev = S.history.pop(); if (!prev) return;
  Object.assign(S, prev); render();
});
homeBtn.addEventListener("click", showStart);
const musicBtn = document.getElementById("musicBtn");
function syncMusic() { musicBtn.setAttribute("aria-pressed", String(S.music)); musicBtn.textContent = S.music ? "🎵" : "🔇"; MUSIC.setOn(S.music); }
musicBtn.addEventListener("click", () => { S.music = !S.music; store.set("music", S.music); syncMusic(); MUSIC.unlock(); });
syncMusic();
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) { const b = book.querySelectorAll(".choice"); if (b[n - 1] && b[n - 1].offsetParent && b[n - 1].closest(".choices,.mapgo") && getComputedStyle(b[n - 1].parentElement).visibility !== "hidden") b[n - 1].click(); }
});

syncRead();
drawShelf();
if (S.narrator === "dad") loadManifest();
showStart();
</script>
