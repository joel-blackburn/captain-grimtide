<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Curse of Captain Grimtide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b1d0e;
    --paper: #f6ead0;
    --paper-dark: #e6d3a8;
    --edge: #b9925a;
    --wood: #3b2414;
    --gold: #f2b632;
    --gold-dark: #b9821a;
    --red: #b8372b;
    --red-dark: #7f241c;
    --sea: #1c4f6e;
    --sea-dark: #0f2e44;
    --ghost: #7ef0c4;
    --hero-a: #2f7fb5;
    --hero-b: #c9502e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 2px, transparent 2px 120px),
      linear-gradient(#24160c, #3b2414 40%, #2a190d);
    display: flex; justify-content: center;
    padding: 14px 10px 40px;
  }
  .app { width: 100%; max-width: 780px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  header.top h1 {
    font-family: "Pirata One", "Nunito", serif; font-weight: 400;
    font-size: clamp(26px, 6vw, 38px); margin: 0; color: var(--gold);
    text-shadow: 0 3px 0 #000, 0 0 18px rgba(242,182,50,.35); letter-spacing: 1px;
  }
  .tools { display: flex; gap: 6px; }
  .tbtn {
    font: inherit; font-weight: 800; font-size: 14px; cursor: pointer;
    border: 2px solid #000; border-radius: 10px; padding: 7px 11px;
    background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 #000;
  }
  .tbtn[aria-pressed="true"] { background: var(--gold); }
  .tbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  .tbtn[disabled] { opacity: .45; cursor: default; }

  .book {
    background: var(--paper);
    border-radius: 18px; overflow: hidden;
    border: 3px solid #000;
    box-shadow: 0 14px 40px rgba(0,0,0,.6), inset 0 0 0 6px var(--paper-dark), inset 0 0 60px rgba(120,80,20,.25);
  }
  .page { animation: turn .45s ease; }
  @keyframes turn { from { opacity: 0; transform: perspective(900px) rotateY(-10deg) translateX(26px); } to { opacity: 1; transform: none; } }

  /* ---------- Scenes ---------- */
  .scene { position: relative; aspect-ratio: 16 / 8; overflow: hidden; border-bottom: 4px solid #000; }
  .scene.dusk     { background: linear-gradient(#f3925a 0%, #c75b5b 35%, #5b3b6e 60%, #23324f 61%, #152238 100%); }
  .scene.fog      { background: linear-gradient(#3c4a5c 0%, #6f7f8f 45%, #2b3a4b 61%, #18222e 100%); }
  .scene.port     { background: linear-gradient(#0f1d33 0%, #253b5c 58%, #3a2a1c 59%, #2a1d12 100%); }
  .scene.cave     { background: radial-gradient(circle at 50% 65%, #6b4a2a 0%, #3a2616 45%, #140c06 100%); }
  .scene.sea      { background: linear-gradient(#081428 0%, #14294a 45%, #0e3a52 46%, #061a28 100%); }
  .scene.light    { background: radial-gradient(circle at 70% 18%, #b6ff9e 0%, #3f7a48 18%, #172c2a 50%, #0a1418 100%); }
  .scene.alley    { background: linear-gradient(#1a1230 0%, #3a2244 50%, #4a2d1a 51%, #26170c 100%); }
  .scene.ghost    { background: radial-gradient(circle at 50% 45%, #1f6b55 0%, #0d2f2a 45%, #050c0c 100%); }
  .scene.dawn     { background: linear-gradient(#ffd27a 0%, #ffb37a 35%, #6fb3d6 61%, #2a7aa8 100%); }
  .scene .art { position: absolute; line-height: 1; user-select: none; filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); animation: bob 3.2s ease-in-out infinite; }
  .scene .art.main { font-size: clamp(66px, 16vw, 124px); left: 50%; top: 52%; transform: translate(-50%, -50%); animation-name: bobMain; }
  .scene .art.side { font-size: clamp(34px, 8.5vw, 62px); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes bobMain { 0%,100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -56%); } }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene svg .bob { animation: bob 3.2s ease-in-out infinite; }
  .scene svg .shake { animation: shake .5s ease-in-out infinite; }
  .scene svg .flick { animation: flick 1.6s ease-in-out infinite; }
  .scene svg .glow { animation: glowp 2.4s ease-in-out infinite; }
  .scene svg .drift { animation: drift 10s ease-in-out infinite alternate; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  @keyframes flick { 0%,100% { opacity: 1; } 45% { opacity: .72; } 55% { opacity: .9; } }
  @keyframes glowp { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .scene .moon { position: absolute; right: 7%; top: 9%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: #fff6d6; box-shadow: 0 0 30px 8px rgba(255,246,214,.35); }
  .scene .mist { position: absolute; left: -20%; right: -20%; bottom: 8%; height: 34%;
    background: radial-gradient(ellipse at 30% 50%, rgba(220,235,240,.35), transparent 60%), radial-gradient(ellipse at 75% 60%, rgba(220,235,240,.28), transparent 60%);
    animation: drift 9s ease-in-out infinite alternate; }
  .scene.ghost .mist { background: radial-gradient(ellipse at 30% 50%, rgba(126,240,196,.25), transparent 60%), radial-gradient(ellipse at 75% 60%, rgba(126,240,196,.2), transparent 60%); }
  @keyframes drift { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
  .scene .sparkle { position: absolute; font-size: 16px; animation: twinkle 2.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }

  .content { padding: 20px clamp(16px, 4vw, 32px) 24px; }
  .story { font-size: clamp(19px, 3.5vw, 22px); line-height: 1.6; margin: 0 0 20px; white-space: pre-line; }
  .story strong { color: var(--red-dark); }

  /* ---------- Buttons ---------- */
  .choices { display: grid; gap: 12px; }
  .choice {
    font: inherit; font-size: clamp(17px, 3.3vw, 20px); font-weight: 800; text-align: left;
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 16px; min-height: 58px; cursor: pointer;
    border: 3px solid #000; border-radius: 14px;
    background: var(--red); color: #fff; box-shadow: 0 5px 0 #000;
  }
  .choice:nth-child(2) { background: var(--sea); }
  .choice:nth-child(3) { background: #6b4aa8; }
  .choice:nth-child(4) { background: #2f7d4f; }
  .choice:nth-child(5) { background: #8a5a2b; }
  .choice:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
  .choice.solo { animation: nudge 1.8s ease-in-out 1.2s infinite; }
  @keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  .choice .em { font-size: 1.45em; }
  .choice .num { margin-left: auto; font-size: 13px; background: rgba(255,255,255,.2); border-radius: 8px; padding: 2px 8px; }
  button:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

  /* ---------- Chat ---------- */
  .chat { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; min-height: 120px; cursor: pointer; }
  .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 92%; animation: pop .3s ease; }
  .msg.right { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: #fff; border: 3px solid #000; }
  .bubble { padding: 10px 14px; border-radius: 16px; border: 3px solid #000; background: #fff; font-size: clamp(18px, 3.4vw, 21px); line-height: 1.45; }
  .bubble .who { display: block; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 2px; opacity: .75; }
  .msg.left .bubble { border-bottom-left-radius: 4px; }
  .msg.right .bubble { border-bottom-right-radius: 4px; }
  .msg.hero-a .bubble { background: #dcefff; }
  .msg.hero-b .bubble { background: #ffe3d6; }
  .msg.char-grim .bubble { background: #d9fff0; }
  .msg.char-grim .avatar { background: #0d2f2a; }
  .narr { align-self: center; text-align: center; font-style: italic; font-size: clamp(17px, 3.2vw, 19px); color: #5a4428; max-width: 90%; animation: pop .3s ease; }
  .typing { align-self: flex-start; font-size: 26px; letter-spacing: 3px; color: #8a6a3a; animation: blink 1s infinite; padding-left: 58px; }
  @keyframes blink { 50% { opacity: .3; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .skip { display: block; margin: 0 0 14px auto; font: inherit; font-size: 14px; font-weight: 800; background: none; border: 0; color: #7a5a2a; cursor: pointer; text-decoration: underline; }

  /* ---------- Map ---------- */
  .maphead { padding: 14px clamp(14px, 3vw, 26px) 6px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
  .maphead h2 { font-family: "Pirata One", serif; font-weight: 400; font-size: clamp(26px, 5vw, 34px); margin: 0; }
  .clock { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
  .pips { display: flex; gap: 5px; }
  .pip { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #000; background: var(--gold); display: grid; place-items: center; font-size: 14px; }
  .pip.gone { background: #4a3a5a; }
  .mapwrap { position: relative; margin: 6px clamp(10px, 2.5vw, 22px) 0; border: 3px solid #000; border-radius: 14px; overflow: hidden; }
  .mapwrap svg { display: block; width: 100%; height: auto; }
  .loc {
    position: absolute; transform: translate(-50%, -50%);
    font: inherit; font-weight: 800; font-size: clamp(12px, 2.4vw, 15px); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: 0; color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000;
  }
  .loc .pin { font-size: clamp(30px, 7vw, 48px); line-height: 1; filter: drop-shadow(0 4px 4px rgba(0,0,0,.6)); transition: transform .15s; animation: bob 2.6s ease-in-out infinite; }
  .loc:hover .pin { transform: scale(1.12); }
  .loc .tag { background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  .loc.done { cursor: default; }
  .loc.done .pin { filter: grayscale(1) brightness(.7); animation: none; }
  .loc.done .tag::after { content: " ✔"; color: var(--ghost); }
  .boat { position: absolute; transform: translate(-50%, -50%); font-size: clamp(26px, 6vw, 38px); transition: left 1s ease, top 1s ease; pointer-events: none; filter: drop-shadow(0 3px 3px rgba(0,0,0,.6)); }
  .bag { padding: 12px clamp(14px, 3vw, 26px) 4px; }
  .bag h3 { margin: 0 0 6px; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
  .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .item { display: flex; align-items: center; gap: 6px; background: #fff; border: 2px solid #000; border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 800; font-size: 15px; animation: pop .4s ease; }
  .item .ie { font-size: 22px; }
  .maptip { padding: 6px clamp(14px, 3vw, 26px) 0; font-size: 18px; line-height: 1.5; }
  .mapgo { padding: 12px clamp(14px, 3vw, 26px) 22px; }

  /* ---------- Endings ---------- */
  .ending-badge { text-align: center; margin: 0 0 14px; }
  .ending-badge .label { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--red-dark); font-weight: 800; }
  .ending-badge .title { font-family: "Pirata One", serif; font-size: clamp(32px, 7vw, 46px); margin: 2px 0 0; }
  .new-flag { display: inline-block; margin-top: 6px; background: var(--gold); border: 2px solid #000; border-radius: 999px; padding: 4px 14px; font-weight: 800; animation: pop .5s ease; }

  .shelf { margin-top: 14px; background: rgba(0,0,0,.35); border: 2px solid #000; border-radius: 14px; padding: 10px 14px; color: var(--paper); }
  .shelf h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 1px; }
  .slots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .slot { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.08); border: 2px dashed rgba(255,255,255,.25); font-size: clamp(18px, 4.5vw, 28px); font-weight: 800; color: rgba(255,255,255,.4); }
  .slot.found { background: var(--paper); border: 2px solid #000; color: var(--ink); }

  /* ---------- Start ---------- */
  .start { padding: 22px clamp(16px, 5vw, 40px) 28px; text-align: center; }
  .start h2 { font-family: "Pirata One", serif; font-weight: 400; font-size: clamp(30px, 7vw, 44px); margin: 0 0 4px; }
  .start p { font-size: 19px; margin: 0 0 18px; line-height: 1.5; }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 480px; margin: 0 auto 16px; text-align: left; }
  @media (max-width: 460px) { .names { grid-template-columns: 1fr; } }
  .names label { font-weight: 800; font-size: 16px; }
  .names input { font: inherit; font-size: 22px; font-weight: 700; width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 12px; border: 3px solid #000; background: #fff; }
  .err { color: var(--red); font-weight: 800; min-height: 22px; margin: 0 0 6px; }
  .bigbtn { font: inherit; font-size: 22px; font-weight: 800; cursor: pointer; padding: 13px 28px; border-radius: 999px; border: 3px solid #000; background: var(--red); color: #fff; box-shadow: 0 5px 0 #000; }
  .bigbtn.alt { background: var(--paper); color: var(--ink); font-size: 17px; padding: 10px 18px; }
  .bigbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
  .stage { position: relative; aspect-ratio: 4 / 3; max-height: 82vh; max-height: 82dvh; margin: 0 auto; overflow: hidden; border-bottom: 4px solid #000; background: #000; container-type: size; }
  .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gamehost { position: absolute; inset: 0; }
  .gamecanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: clamp(6px, 2.2cqh, 14px); padding: clamp(8px, 3cqh, 20px); text-align: center; background: rgba(10,8,4,.66); color: #fff; overflow-y: auto; }
  .gtitle { font-family: "Pirata One", serif; font-size: clamp(26px, 9cqh, 58px); color: var(--gold); text-shadow: 0 3px 0 #000; line-height: 1; }
  .ghow { margin: 0; font-size: clamp(14px, 4.4cqh, 22px); line-height: 1.4; max-width: 560px; font-weight: 700; text-shadow: 0 2px 0 #000; }
  .overlay .bigbtn { font-size: clamp(15px, 5cqh, 22px); padding: clamp(7px, 2cqh, 13px) clamp(14px, 4cqw, 28px); }
  .overlay .row { gap: 8px; }
  .tiltTip { font-size: 13px; font-weight: 700; color: #ffe9a8; }
  .lvl { display: flex; gap: 8px; }
  .lvlbtn { font: inherit; font-weight: 800; font-size: 16px; padding: 8px 14px; border-radius: 999px; border: 3px solid #000; background: #fff; cursor: pointer; }
  .lvlbtn[aria-pressed="true"] { background: var(--gold); }
  .skipgame { font: inherit; background: none; border: 0; color: #e8dcc0; text-decoration: underline; font-size: 14px; cursor: pointer; }
  .won { font-size: clamp(18px, 6cqh, 30px); font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .best { display: block; font-size: 15px; font-weight: 700; opacity: .85; }
  .p8 { display: inline-grid; place-items: center; width: 1.35em; height: 1.35em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f4f6fa, #c3cad4); border: 2px solid #000; color: #4b5563; font-weight: 900; font-size: .9em; line-height: 1; vertical-align: -.2em; }
  .purse { font-weight: 800; font-size: 18px; background: #fff; border: 2px solid #000; border-radius: 999px; padding: 3px 12px; }
  .loot { margin-top: 10px; font-weight: 800; font-size: 20px; }
  .pickhead { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; margin: 0 auto 18px; }
  @media (max-width: 460px) { .pick { grid-template-columns: 1fr; } }
  .pickcard { font: inherit; text-align: left; cursor: pointer; display: flex; gap: 10px; align-items: center;
    padding: 12px; border-radius: 14px; border: 3px solid #000; background: #fff; box-shadow: 0 4px 0 #000; color: var(--ink); }
  .pickcard[aria-pressed="true"] { background: var(--gold); }
  .pickcard .pem { font-size: 34px; }
  .pickcard .ptxt { display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.3; }
  .pickcard strong { font-family: "Pirata One", serif; font-weight: 400; font-size: 24px; }
  .reveal { display: grid; gap: 12px; margin: 6px auto 18px; max-width: 520px; }
  .pname { background: #fff; border: 3px solid #000; border-radius: 14px; padding: 12px; animation: pop .5s ease; }
  .pname .real { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; opacity: .6; }
  .pname .pirate { font-family: "Pirata One", serif; font-size: clamp(28px, 6.5vw, 38px); line-height: 1.1; }
  .pname.a .pirate { color: var(--hero-a); }
  .pname.b .pirate { color: var(--hero-b); }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>☠️ The Curse of Captain Grimtide</h1>
    <div class="tools">
      <button class="tbtn" id="readBtn" aria-pressed="false">🔈 Read to me</button>
      <button class="tbtn" id="backBtn">↩️ Back</button>
      <button class="tbtn" id="musicBtn" aria-label="Music on or off">🎵</button>
      <button class="tbtn" id="homeBtn" aria-label="Start again">🏠</button>
    </div>
  </header>
  <main class="book" id="book" aria-live="polite"></main>
  <section class="shelf" aria-label="Endings found">
    <h2><span>🏆 Endings found</span><span id="count">0 / 7</span></h2>
    <div class="slots" id="slots"></div>
  </section>
</div>

<script>/* =====================================================================
   ART — every picture in the story is drawn here in SVG.
   A page's "pic" says which background to use and which parts to add:
     pic: { bg: "cave", parts: ["skeleton:scared@400,330,1", "kidA@200,340,1"] }
   Part format:  name[:option]@x,y,scale   (negative scale = face the other way)
   ===================================================================== */
const ART = (() => {
  const K = 'stroke="#000" stroke-linejoin="round" stroke-linecap="round"';

  const DEFS = `<defs>
    <radialGradient id="glG"><stop offset="0" stop-color="#7ef0c4" stop-opacity=".9"/><stop offset="1" stop-color="#7ef0c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glY"><stop offset="0" stop-color="#ffe17a" stop-opacity=".9"/><stop offset="1" stop-color="#ffe17a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glO"><stop offset="0" stop-color="#ffb347" stop-opacity=".9"/><stop offset="1" stop-color="#ff7b2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="glW"><stop offset="0" stop-color="#fff6d6" stop-opacity=".5"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glP"><stop offset="0" stop-color="#d9a8ff" stop-opacity=".9"/><stop offset="1" stop-color="#b06bff" stop-opacity="0"/></radialGradient>
  </defs>`;

  /* ---------- small shared bits ---------- */
  const stars = (n, seed, h) => { let s = ""; let r = seed; for (let i = 0; i < n; i++) { r = (r * 9301 + 49297) % 233280; const x = (r / 233280) * 800; r = (r * 9301 + 49297) % 233280; const y = (r / 233280) * h; s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(1 + (i % 3) * .5)}" fill="#fff6d6"/>`; } return s; };
  const moon = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r * 1.6}" fill="url(#glW)"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff6d6"/><circle cx="${x - r * .3}" cy="${y - r * .2}" r="${r * .17}" fill="#e6dcb8"/><circle cx="${x + r * .3}" cy="${y + r * .25}" r="${r * .12}" fill="#e6dcb8"/>`;
  const waves = (col, list) => `<g stroke="${col}" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round">${list.map(([x, y]) => `<path d="M${x} ${y} q12 -6 24 0 t24 0"/>`).join("")}</g>`;
  const fog = (col, op) => `<g class="drift" fill="${col}"><ellipse cx="160" cy="340" rx="230" ry="30" opacity="${op}"/><ellipse cx="660" cy="352" rx="240" ry="32" opacity="${op}"/><ellipse cx="420" cy="385" rx="320" ry="26" opacity="${op * .9}"/></g>`;
  const sky = (id, a, b, h = 400) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;

  P.gull = (opt) => `<g class="bob"><ellipse cx="0" cy="-14" rx="16" ry="12" fill="#f4f4f4" ${K} stroke-width="3"/><circle cx="12" cy="-26" r="9" fill="#f4f4f4" ${K} stroke-width="3"/><path d="M20 -26 l10 3 l-10 3 Z" fill="#f2b632" stroke="#000" stroke-width="2"/><circle cx="14" cy="-28" r="2" fill="#000"/><path d="M-10 -18 Q-2 -10 8 -16" stroke="#9aa" stroke-width="3" fill="none"/>
    ${opt === "coin" ? `<path d="M6 -20 Q10 -8 16 -18" stroke="#b9821a" stroke-width="2" fill="none"/><ellipse cx="11" cy="-10" rx="6" ry="5" fill="#f2b632" stroke="#000" stroke-width="2"/>` : ""}</g>`;
  P.monkey = (opt) => `<g class="bob">
    <path d="M14 -20 C50 -20 50 -60 30 -60 C20 -60 22 -46 32 -48" stroke="#000" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M14 -20 C50 -20 50 -60 30 -60 C20 -60 22 -46 32 -48" stroke="#8b5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-24" rx="18" ry="22" fill="#8b5a2b" ${K} stroke-width="3.5"/>
    <path d="M-14 -40 L14 -40 L12 -12 L-12 -12 Z" fill="#b8372b" ${K} stroke-width="3"/><circle cx="0" cy="-30" r="2" fill="#f2b632"/><circle cx="0" cy="-22" r="2" fill="#f2b632"/>
    <path d="M-8 -2 l-6 4 M8 -2 l6 4" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-22" cy="-62" r="8" fill="#d9a877" ${K} stroke-width="3"/><circle cx="22" cy="-62" r="8" fill="#d9a877" ${K} stroke-width="3"/>
    <circle cx="0" cy="-60" r="18" fill="#8b5a2b" ${K} stroke-width="3.5"/><ellipse cx="0" cy="-56" rx="12" ry="11" fill="#e8c49a"/>
    <circle cx="-5" cy="-60" r="2.5" fill="#000"/><circle cx="5" cy="-60" r="2.5" fill="#000"/><path d="M-5 -51 Q0 -47 5 -51" stroke="#000" stroke-width="2" fill="none"/>
    <path d="M-16 -36 L-30 -54" stroke="#000" stroke-width="7" stroke-linecap="round"/><path d="M-16 -36 L-30 -54" stroke="#8b5a2b" stroke-width="3.5" stroke-linecap="round"/>
    ${opt === "coin" ? `<g transform="translate(-34 -62) scale(.55)">${P.coin()}</g>` : opt === "banana" ? `<g transform="translate(-34 -60)">${P.banana()}</g>` : ""}
  </g>`;

  P.grim = (opt = "") => {
    const solid = opt === "solid", happy = opt === "happy", scared = opt === "scared";
    return `<g class="${solid ? "" : "bob"}">
      ${solid ? "" : `<ellipse cx="0" cy="-120" rx="120" ry="150" fill="url(#glG)" opacity=".55"/>`}
      <g opacity="${solid ? 1 : .88}">
      <path d="M-60 -170 L60 -170 L74 -20 Q60 0 46 -14 Q32 4 18 -12 Q4 4 -10 -12 Q-24 4 -38 -12 Q-52 2 -70 -20 Z" fill="${solid ? "#5a8f7e" : "#bff5e0"}" stroke="#0a2a22" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-24 -170 L0 -120 L24 -170" fill="${solid ? "#3d6a5c" : "#9fdcc6"}" stroke="#0a2a22" stroke-width="3"/>
      <g fill="${solid ? "#c9a24a" : "#e6fff3"}" stroke="#0a2a22" stroke-width="2"><circle cx="-34" cy="-130" r="4"/><circle cx="-34" cy="-110" r="4"/><circle cx="34" cy="-130" r="4"/><circle cx="34" cy="-110" r="4"/></g>
      <path d="${happy ? "M58 -150 L84 -176" : scared ? "M58 -150 L90 -190" : "M58 -150 L96 -120"}" stroke="#0a2a22" stroke-width="16" stroke-linecap="round"/><path d="${happy ? "M58 -150 L84 -176" : scared ? "M58 -150 L90 -190" : "M58 -150 L96 -120"}" stroke="${solid ? "#5a8f7e" : "#bff5e0"}" stroke-width="10" stroke-linecap="round"/>
      <path d="${scared ? "M-58 -150 L-90 -190" : "M-58 -150 L-84 -112"}" stroke="#0a2a22" stroke-width="16" stroke-linecap="round"/><path d="${scared ? "M-58 -150 L-90 -190" : "M-58 -150 L-84 -112"}" stroke="${solid ? "#5a8f7e" : "#bff5e0"}" stroke-width="10" stroke-linecap="round"/>
      ${opt === "" || solid ? `<path d="M96 -120 L150 -170 L156 -162 L104 -112 Z" fill="#9aa3ad" ${K} stroke-width="3"/><rect x="88" y="-126" width="18" height="10" rx="3" transform="rotate(-42 97 -121)" fill="#c9a24a" stroke="#000" stroke-width="2.5"/>` : ""}
      ${happy ? `<g transform="translate(90 -184) scale(.7)">${P.choc()}</g>` : ""}
      <circle cx="0" cy="-210" r="40" fill="${solid ? "#7fb3a2" : "#d9fff0"}" stroke="#0a2a22" stroke-width="4"/>
      <ellipse cx="-15" cy="-216" rx="11" ry="${happy ? 4 : 12}" fill="#0a2a22"/><ellipse cx="15" cy="-216" rx="11" ry="${happy ? 4 : 12}" fill="#0a2a22"/>
      ${happy ? "" : `<circle cx="-15" cy="-214" r="4" fill="#7ef0c4" class="glow"/><circle cx="15" cy="-214" r="4" fill="#7ef0c4" class="glow"/>`}
      <path d="M-30 -232 L-6 -224 M30 -232 L6 -224" stroke="#0a2a22" stroke-width="5" stroke-linecap="round" ${happy || scared ? 'transform="translate(0 -6)"' : ""}/>
      <path d="M-46 -196 Q-56 -150 -30 -130 Q-20 -112 0 -120 Q20 -112 30 -130 Q56 -150 46 -196 Q30 -180 0 -184 Q-30 -180 -46 -196 Z" fill="${solid ? "#4f7f70" : "#9fd8c4"}" stroke="#0a2a22" stroke-width="3.5" stroke-linejoin="round"/>
      ${happy ? `<path d="M-16 -186 Q0 -170 16 -186 Z" fill="#0a2a22"/>` : scared ? `<ellipse cx="0" cy="-180" rx="9" ry="11" fill="#0a2a22"/>` : `<path d="M-18 -180 Q0 -192 18 -180" stroke="#0a2a22" stroke-width="4" fill="none"/>`}
      ${[[-28, -150], [20, -140], [-4, -128]].map(([x, y]) => `<g transform="translate(${x} ${y})"><ellipse cx="0" cy="0" rx="7" ry="5" fill="#d9442e" stroke="#000" stroke-width="2"/><path d="M-7 -2 l-5 -4 M7 -2 l5 -4" stroke="#d9442e" stroke-width="2.5"/><circle cx="-2" cy="-5" r="1.5" fill="#000"/><circle cx="2" cy="-5" r="1.5" fill="#000"/></g>`).join("")}
      <path d="M-62 -244 L62 -244 L48 -266 Q0 -290 -48 -266 Z" fill="#141414" ${K} stroke-width="4"/><path d="M-70 -244 Q0 -232 70 -244" stroke="#000" stroke-width="5" fill="none"/>
      <circle cx="0" cy="-262" r="7" fill="#e9e2d0" stroke="#000" stroke-width="2"/>
      </g>
      ${solid ? sparkle(-70, -200, 1.2, "#ffffff") + sparkle(70, -60, 1, "#bfe8ff") + sparkle(-50, -40, .9) : ""}
    </g>`;
  };

  P.ship = () => SHIP;
  P.barrel = () => `<path d="M-45 0 L-55 -70 Q0 -86 55 -70 L45 0 Z" fill="#9a6232" ${K} stroke-width="4"/>
    <ellipse cx="0" cy="-70" rx="55" ry="14" fill="#6b4220" ${K} stroke-width="4"/>
    <g stroke="#3a2414" stroke-width="4" fill="none"><path d="M-52 -48 Q0 -38 52 -48"/><path d="M-50 -18 Q0 -8 49 -18"/></g>
    <path d="M-60 -74 Q-20 -100 27 -86 L55 -100 L49 -74 L59 -54 L27 -66 Q-20 -54 -60 -74 Z" fill="#b9c7d6" ${K} stroke-width="4"/>
    <path d="M-35 -78 q10 -6 20 0" stroke="#7d8ea3" stroke-width="3" fill="none"/>
    <circle cx="-47" cy="-80" r="5" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="-47" cy="-80" r="2" fill="#000"/>`;
  P.tentacles = () => [[230, 300, -1], [600, 300, 1], [330, 310, -1], [520, 310, 1]].map(([x, y, d]) => `<g transform="translate(${x} ${y}) scale(${d * 1.4} 1.6)">${P.tentacle()}</g>`).join("");
  P.splash = () => `<g fill="#bfe8ff" ${K} stroke-width="3"><path d="M-40 0 Q-30 -40 -20 -10 Q-10 -60 0 -10 Q10 -50 20 -10 Q30 -36 40 0 Z"/></g>`;
  P.hat = () => `<path d="M-22 0 L22 0 L14 -14 Q0 -22 -14 -14 Z" fill="#1a1a1a" ${K} stroke-width="3"/>`;
  P.door = () => `<path d="M-14 0 L-14 -34 Q0 -48 14 -34 L14 0 Z" fill="#3a2010" ${K} stroke-width="3"/><path d="M-30 -60 l8 8 M30 -60 l-8 8 M0 -70 v10" stroke="#ffe14a" stroke-width="4" stroke-linecap="round"/>`;
  P.rock = () => `<path d="M-80 0 L-50 -120 L-20 -150 L10 -170 L40 -130 L70 -60 L90 0 Z" fill="#2b2f36" ${K} stroke-width="5"/><path d="M-20 -150 L-6 -128 L-26 -120 Z" fill="#3d434c"/>`;
  P.zzz = () => `<g fill="#e9e2d0" font-family="Pirata One, serif" font-size="30" class="glow"><text x="0" y="0">z</text><text x="16" y="-18" font-size="22">z</text><text x="28" y="-32" font-size="16">z</text></g>`;
  P.mum = () => `<g class="bob"><path d="M-20 0 L-14 -60 L14 -60 L20 0 Z" fill="#8a3a8a" ${K} stroke-width="3.5"/><circle cx="0" cy="-74" r="15" fill="#f2c9a0" ${K} stroke-width="3.5"/><path d="M-16 -78 Q0 -100 16 -78 Q18 -64 14 -60 Q12 -80 0 -84 Q-12 -80 -14 -60 Q-18 -64 -16 -78 Z" fill="#5a3418" stroke="#000" stroke-width="2.5"/>
    <ellipse cx="0" cy="-66" rx="4" ry="5" fill="#000"/><path d="M14 -52 L36 -80" stroke="#000" stroke-width="8" stroke-linecap="round"/><path d="M14 -52 L36 -80" stroke="#f2c9a0" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 -90 q10 -6 4 8 M54 -96 q14 -6 6 14" stroke="#fff" stroke-width="3" fill="none"/></g>`;

  /* =====================================================================
     COMPOSE
     ===================================================================== */
  function part(spec) {
    const [nameOpt, pos = "0,0,1"] = spec.split("@");
    const [name, opt] = nameOpt.split(":");
    const [x, y, s = 1, r = 0] = pos.split(",").map(Number);
    if (!P[name]) return "";
    return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s} ${Math.abs(s)})">${P[name](opt)}</g>`;
  }
  function scene(pic, label) {
    const bg = BG[pic.bg] ? BG[pic.bg](pic.mode) : "";
    const uid = Math.random().toString(36).slice(2, 7);
    const svg = `<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${(label || "Story picture").replace(/"/g, "&quot;")}">${DEFS}${bg}${(pic.parts || []).map(part).join("")}</svg>`;
    return svg.replace(/id="([A-Za-z]+)"/g, `id="$1_${uid}"`).replace(/url\(#([A-Za-z]+)\)/g, `url(#$1_${uid})`);
  }
  return { scene };
})();
</script>
<script>/* =====================================================================
   MINI-GAMES — each one draws on a canvas (800 x 600 logical units)
   and works with fingers first, mouse second.
   GAMES[name](api) returns { update(dt), draw(ctx), down(x,y), move(x,y), up(x,y), hud() }
   api: { W, H, easy, sfx(name), end(pieces, message) }
   ===================================================================== */
const GAMES = (() => {
  const W = 800, H = 600;
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- drawing helpers (bold-outline cartoon style) ---------- */
  function outline(ctx, w = 4) { ctx.lineWidth = w; ctx.strokeStyle = "#000"; ctx.lineJoin = "round"; ctx.lineCap = "round"; }
  function circle(ctx, x, y, r, fill, lw = 4) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); if (lw) { outline(ctx, lw); ctx.stroke(); } }
  function rrect(ctx, x, y, w, h, r, fill, lw = 4) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); if (lw) { outline(ctx, lw); ctx.stroke(); } }
  function text(ctx, s, x, y, size = 28, fill = "#fff", align = "center") {
    ctx.font = `800 ${size}px Nunito, system-ui, sans-serif`; ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.lineWidth = Math.max(4, size / 5); ctx.strokeStyle = "#000"; ctx.strokeText(s, x, y); ctx.fillStyle = fill; ctx.fillText(s, x, y);
  }
  function coin8(ctx, x, y, r = 18, spin = 0) {
    const sx = Math.abs(Math.cos(spin)) * .8 + .2;
    ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
    circle(ctx, 0, 0, r, "#d9dee6", 3); circle(ctx, 0, 0, r * .72, "#c3cad4", 0);
    ctx.restore();
    if (sx > .5) { ctx.font = `900 ${r * 1.1}px Nunito, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#5b6470"; ctx.fillText("8", x, y + 1); }
  }
  function fish(ctx, x, y, ang = 0, s = 1, col = "#b9c7d6") {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
    ctx.beginPath(); ctx.moveTo(-34, 0); ctx.quadraticCurveTo(-4, -22, 26, -4); ctx.lineTo(44, -18); ctx.lineTo(38, 0); ctx.lineTo(44, 18); ctx.lineTo(26, 4); ctx.quadraticCurveTo(-4, 22, -34, 0);
    ctx.fillStyle = col; ctx.fill(); outline(ctx, 4); ctx.stroke();
    circle(ctx, -20, -4, 5, "#fff", 2); circle(ctx, -20, -4, 2, "#000", 0);
    ctx.restore();
  }
  function sparkles(list, x, y, n = 8, col = "#fff6c8") { for (let i = 0; i < n; i++) list.push({ x, y, vx: rand(-160, 160), vy: rand(-220, -40), life: rand(.4, .8), col }); }
  function updSparkles(list, dt) { for (const p of list) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; } for (let i = list.length - 1; i >= 0; i--) if (list[i].life <= 0) list.splice(i, 1); }
  function drawSparkles(ctx, list) { for (const p of list) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); circle(ctx, p.x, p.y, 5, p.col, 0); } ctx.globalAlpha = 1; }
  function floaters(list, dt) { for (const f of list) { f.y -= 50 * dt; f.life -= dt; } for (let i = list.length - 1; i >= 0; i--) if (list[i].life <= 0) list.splice(i, 1); }
  function drawFloaters(ctx, list) { for (const f of list) { ctx.globalAlpha = clamp(f.life * 2, 0, 1); text(ctx, f.s, f.x, f.y, 30, f.col || "#ffe14a"); } ctx.globalAlpha = 1; }
  function heart(ctx, x, y, on) { ctx.save(); ctx.translate(x, y); ctx.beginPath(); ctx.moveTo(0, 8); ctx.bezierCurveTo(-18, -6, -10, -20, 0, -10); ctx.bezierCurveTo(10, -20, 18, -6, 0, 8); ctx.fillStyle = on ? "#e8413a" : "#555"; ctx.fill(); outline(ctx, 3); ctx.stroke(); ctx.restore(); }
  function kid(ctx, x, y, col, band, s = 1, pose = 0) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.strokeStyle = "#000"; ctx.lineWidth = 9; ctx.lineCap = "round";
    const lk = Math.sin(pose) * 12;
    ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(-8 - lk, 0); ctx.moveTo(6, -30); ctx.lineTo(8 + lk, 0); ctx.stroke();
    ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 5; ctx.stroke();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(-14, -56); ctx.lineTo(-24 + lk, -34); ctx.moveTo(14, -56); ctx.lineTo(24 - lk, -34); ctx.stroke();
    ctx.strokeStyle = "#f2c9a0"; ctx.lineWidth = 5; ctx.stroke();
    rrect(ctx, -18, -64, 36, 36, 8, col, 3.5);
    circle(ctx, 0, -80, 16, "#f2c9a0", 3.5);
    ctx.beginPath(); ctx.moveTo(-16, -84); ctx.quadraticCurveTo(0, -104, 16, -84); ctx.closePath(); ctx.fillStyle = band; ctx.fill(); outline(ctx, 3); ctx.stroke();
    circle(ctx, -6, -80, 2.4, "#000", 0); circle(ctx, 6, -80, 2.4, "#000", 0);
    ctx.restore();
  }
  function rowboat(ctx, x, y, s = 1, lantern = true) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath(); ctx.moveTo(-60, -10); ctx.lineTo(62, -10); ctx.lineTo(48, 18); ctx.quadraticCurveTo(0, 28, -46, 18); ctx.closePath(); ctx.fillStyle = "#8b5a2b"; ctx.fill(); outline(ctx, 4); ctx.stroke();
    circle(ctx, -22, -26, 12, "#2f7fb5", 3); circle(ctx, 20, -28, 13, "#c9502e", 3);
    ctx.beginPath(); ctx.moveTo(-34, -32); ctx.quadraticCurveTo(-22, -46, -10, -32); ctx.fillStyle = "#b8372b"; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7, -34); ctx.quadraticCurveTo(20, -52, 33, -34); ctx.fillStyle = "#111"; ctx.fill(); ctx.stroke();
    if (lantern) { ctx.globalAlpha = .35; circle(ctx, 46, -36, 26, "#ffcf6b", 0); ctx.globalAlpha = 1; rrect(ctx, 40, -44, 12, 14, 2, "#ffcf6b", 2.5); }
    ctx.restore();
  }

  /* =====================================================================
     1. FISH FLING — drag back and let go to fling fish into the barrel
     ===================================================================== */
  function fishFling(api) {
    const A = { x: 150, y: 430 }, TOTAL = 8;
    let left = TOTAL, score = 0, f = null, drag = null, barrel = null, fx = [], fl = [], doneT = -1, wob = 0;
    const mouth = api.easy ? 120 : 84;
    function newBarrel() { barrel = { x: rand(470, 690), y: 470, dir: api.easy ? 0 : (Math.random() < .5 ? -1 : 1) }; }
    function newFish() { f = { x: A.x, y: A.y, vx: 0, vy: 0, fly: false, ang: 0, col: left === 1 ? "#cfd9e6" : "#b9c7d6" }; }
    newBarrel(); newFish();
    return {
      hud: () => [`Fish left: ${left}`, `In the barrel: ${score}`],
      down(x, y) { if (f && !f.fly && doneT < 0) drag = { x, y }; },
      move(x, y) { if (drag) { drag.x = x; drag.y = y; } },
      up() {
        if (!drag || !f || f.fly) { drag = null; return; }
        let px = A.x - drag.x, py = A.y - drag.y; const L = Math.hypot(px, py), M = 170;
        if (L < 20) { drag = null; return; }
        if (L > M) { px *= M / L; py *= M / L; }
        f.vx = px * 5.6; f.vy = py * 5.6; f.fly = true; drag = null; api.sfx("whoosh");
      },
      update(dt) {
        wob += dt;
        if (barrel.dir) { barrel.x += barrel.dir * 60 * dt; if (barrel.x > 700 || barrel.x < 440) barrel.dir *= -1; }
        updSparkles(fx, dt); floaters(fl, dt);
        if (doneT >= 0) { doneT -= dt; if (doneT < 0) api.end(score, score === TOTAL ? "Every fish in the barrel! Pudding for everyone!" : `${score} of ${TOTAL} fish in the barrel. Not bad for cabin kids!`); return; }
        if (!f) return;
        if (drag && !f.fly) { let px = drag.x - A.x, py = drag.y - A.y; const L = Math.hypot(px, py); if (L > 170) { px *= 170 / L; py *= 170 / L; } f.x = A.x + px; f.y = A.y + py; }
        if (f.fly) {
          const py0 = f.y;
          f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.ang = Math.atan2(f.vy, f.vx);
          const top = barrel.y - 96;
          if (py0 < top && f.y >= top && Math.abs(f.x - barrel.x) < mouth / 2 && f.vy > 0) {
            score++; sparkles(fx, barrel.x, top, 14); fl.push({ s: "+1", x: barrel.x, y: top - 20, life: 1 }); api.sfx("splash"); api.sfx("coin");
            nextFish(); return;
          }
          if (f.y > H + 60 || f.x > W + 60 || f.x < -60) { api.sfx("plop"); nextFish(); }
        }
        function nextFish() { left--; f = null; if (left <= 0) { doneT = .8; return; } setTimeout(() => { newBarrel(); newFish(); }, 350); }
      },
      draw(ctx) {
        /* dock */
        rrect(ctx, -10, 470, 320, 160, 0, "#7a4b2a", 4);
        ctx.strokeStyle = "#4a2c16"; ctx.lineWidth = 3; for (const yy of [500, 535, 570]) { ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(310, yy); ctx.stroke(); }
        /* crate + barrel */
        rrect(ctx, barrel.x - 70, barrel.y, 140, 140, 4, "#9a6232", 4);
        ctx.strokeStyle = "#5a3418"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(barrel.x - 70, barrel.y); ctx.lineTo(barrel.x + 70, barrel.y + 140); ctx.stroke();
        const top = barrel.y - 96, mw = mouth;
        ctx.beginPath(); ctx.moveTo(barrel.x - mw / 2 - 6, top); ctx.lineTo(barrel.x - mw / 2 + 6, barrel.y); ctx.lineTo(barrel.x + mw / 2 - 6, barrel.y); ctx.lineTo(barrel.x + mw / 2 + 6, top); ctx.closePath();
        ctx.fillStyle = "#9a6232"; ctx.fill(); outline(ctx, 4); ctx.stroke();
        ctx.strokeStyle = "#3a2414"; ctx.lineWidth = 4; for (const yy of [top + 26, top + 64]) { ctx.beginPath(); ctx.moveTo(barrel.x - mw / 2 - 2, yy); ctx.lineTo(barrel.x + mw / 2 + 2, yy); ctx.stroke(); }
        ctx.beginPath(); ctx.ellipse(barrel.x, top, mw / 2 + 6, 12, 0, 0, Math.PI * 2); ctx.fillStyle = "#3a2414"; ctx.fill(); outline(ctx, 4); ctx.stroke();
        /* thrower */
        kid(ctx, 70, 500, "#2f7fb5", "#b8372b", 1.1);
        kid(ctx, 250, 506, "#c9502e", "#1a1a1a", 1, Math.sin(wob * 6));
        /* aiming */
        if (drag && f && !f.fly) {
          ctx.strokeStyle = "#5a3418"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(A.x - 30, A.y - 10); ctx.lineTo(f.x, f.y); ctx.lineTo(A.x + 30, A.y - 10); ctx.stroke();
          if (api.easy) {
            let vx = (A.x - f.x) * 5.6, vy = (A.y - f.y) * 5.6, x = A.x, y = A.y;

  /* =====================================================================
     2. TORCH PANIC — tap torches before they go out

  function torchPanic(api) {

            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(-8, -18, 0, -30); ctx.quadraticCurveTo(8, -18, 8, 0); ctx.closePath(); ctx.fillStyle = "#ffe17a"; ctx.fill();
            ctx.restore();

  /* =====================================================================
     3. REEF RUN — drag the boat left and right, dodge rocks and tentacles
     ===================================================================== */
  function reefRun(api) {
    const DUR = 35; let t = 0, bx = 400, tx = 400, hearts = 3, inv = 0, score = 0, objs = [], spawn = .5, fx = [], fl = [], waves = [], over = false;
    for (let i = 0; i < 12; i++) waves.push({ x: rand(0, W), y: rand(0, H) });
    const speed = () => (api.easy ? 170 : 240) + t * (api.easy ? 3 : 5);
    const finish = () => { over = true; api.end(Math.min(20, score), hearts > 0 ? `You made it through the reef with ${score} pieces of eight!` : `Bonk! The boat needs patching, but you grabbed ${score} pieces of eight on the way.`); };
    return {
      hud: () => [`Pieces of eight: ${score}`, `⏱ ${Math.max(0, Math.ceil(DUR - t))}`],
      hearts: () => hearts,
      down(x) { tx = x; }, move(x) { tx = x; }, up() {},
      update(dt) {
        if (over) return;
        t += dt; inv -= dt; updSparkles(fx, dt); floaters(fl, dt);
        bx += (clamp(tx, 70, 730) - bx) * Math.min(1, dt * 10);
        for (const w of waves) { w.y += speed() * dt * .6; if (w.y > H + 10) { w.y = -10; w.x = rand(0, W); } }
        spawn -= dt;
        if (spawn <= 0) {
          const r = Math.random();
          objs.push(r < .45 ? { k: "coin", x: rand(60, 740), y: -40, r: 20 } : r < .8 ? { k: "rock", x: rand(60, 740), y: -60, r: api.easy ? 34 : 42 } : { k: "tent", x: rand(80, 720), y: -80, r: 30, ph: rand(0, 6) });
          spawn = (api.easy ? .75 : .55) - t * .005;
        }
        for (const o of objs) {
          o.y += speed() * dt; if (o.k === "tent") { o.ph += dt * 3; o.x += Math.sin(o.ph) * 60 * dt; }
          if (!o.gone && dist(o.x, o.y, bx, 500) < o.r + 44) {
            if (o.k === "coin") { o.gone = true; score++; api.sfx("coin"); sparkles(fx, o.x, o.y, 6, "#e6ecf4"); fl.push({ s: "+1", x: o.x, y: o.y - 20, life: .7 }); }

      draw(ctx) {

        ctx.strokeStyle = "rgba(160,210,240,.45)"; ctx.lineWidth = 3;
        for (const w of waves) { ctx.beginPath(); ctx.moveTo(w.x - 20, w.y); ctx.quadraticCurveTo(w.x - 10, w.y - 6, w.x, w.y); ctx.quadraticCurveTo(w.x + 10, w.y - 6, w.x + 20, w.y); ctx.stroke(); }
        for (const o of objs) {
          if (o.gone) continue;

          else if (o.k === "rock") { ctx.beginPath(); ctx.moveTo(o.x - o.r, o.y + o.r * .6); ctx.lineTo(o.x - o.r * .5, o.y - o.r); ctx.lineTo(o.x + o.r * .2, o.y - o.r * .7); ctx.lineTo(o.x + o.r, o.y + o.r * .6); ctx.closePath(); ctx.fillStyle = "#3a3f47"; ctx.fill(); outline(ctx, 4); ctx.stroke(); }

            const path = () => { ctx.beginPath(); ctx.moveTo(o.x, o.y + 40); ctx.quadraticCurveTo(o.x + Math.sin(o.ph) * 30, o.y, o.x - 10, o.y - 40); ctx.quadraticCurveTo(o.x - 30, o.y - 60, o.x - 20, o.y - 46); };
            path(); ctx.stroke(); ctx.strokeStyle = "#7b3fa0"; ctx.lineWidth = 22; path(); ctx.stroke();
          }
        }
        ctx.globalAlpha = inv > 0 && Math.floor(inv * 10) % 2 ? .4 : 1;
        rowboat(ctx, bx, 500, 1.1, !api.flags.noLantern);
        ctx.globalAlpha = 1;
        drawSparkles(ctx, fx); drawFloaters(ctx, fl);
        if (t < 3) text(ctx, "Drag to steer. Grab the coins, dodge the rocks!", 400, 70, 26);
      }
    };
  }

  /* =====================================================================
     4. BREW THE MOONLIGHT SALT — copy the witch's pattern
     ===================================================================== */
  function brew(api) {
    const JARS = [{ x: 160, c: "#4caf50", n: "green" }, { x: 320, c: "#9b59d0", n: "purple" }, { x: 480, c: "#3d9be9", n: "blue" }, { x: 640, c: "#f39c33", n: "orange" }];
    const Y = 450, R = 62, rounds = api.easy ? [2, 3, 4, 5] : [3, 4, 5, 6, 7];
    let round = 0, seq = [], phase = "wait", pt = 1.2, idx = 0, glow = -1, glowT = 0, input = 0, retries = api.easy ? 2 : 1, passed = 0, msg = "Watch Old Mother Brine...", bubble = 0, potion = "#5fbf98", fx = [], over = false;
    function newRound() { seq = []; for (let i = 0; i < rounds[round]; i++) seq.push(Math.floor(Math.random() * 4)); startShow(); }
    function startShow() { phase = "show"; idx = 0; pt = .7; input = 0; msg = "Watch closely..."; }
    function finish() { over = true; const total = rounds.length; api.end(passed * 2, passed === total ? "Perfect! The Moonlight Salt glitters like the stars." : `You brewed ${passed} of ${total} spells. Brine grumbles and finishes the rest herself.`); }
    newRound();
    return {
      hud: () => [`Spell ${Math.min(round + 1, rounds.length)} of ${rounds.length}`, `Pieces of eight: ${passed * 2}`],
      down(x, y) {
        if (phase !== "input" || over) return;
        const j = JARS.findIndex(jr => dist(x, y, jr.x, Y) < R + 12); if (j < 0) return;
        glow = j; glowT = .3; api.sfx("note" + j);
        if (j === seq[input]) {
          input++; potion = JARS[j].c;
          if (input >= seq.length) { passed++; round++; sparkles(fx, 400, 190, 16, "#d9fff0"); api.sfx("cheer"); if (round >= rounds.length) { phase = "end"; setTimeout(finish, 900); } else { phase = "wait"; pt = 1.2; msg = "Yes! Now a longer one..."; setTimeout(newRound, 1100); } }
        } else {
          api.sfx("error"); retries--;
          if (retries < 0) { phase = "end"; msg = "Oops! Wrong jar!"; setTimeout(finish, 900); }
          else { msg = "Oops! Watch again..."; phase = "wait"; setTimeout(startShow, 900); }
        }
      },
      move() {}, up() {},
      update(dt) {
        bubble += dt; glowT -= dt; updSparkles(fx, dt);
        if (phase === "show") {
          pt -= dt;
          if (pt <= 0) {
            if (idx < seq.length) { glow = seq[idx]; glowT = api.easy ? .55 : .4; api.sfx("note" + seq[idx]); idx++; pt = api.easy ? .8 : .6; }
            else { phase = "input"; msg = "Your turn! Tap the jars in the same order."; }
          }
        }
      },
      draw(ctx) {
        /* cauldron */
        ctx.beginPath(); ctx.ellipse(400, 230, 120, 80, 0, 0, Math.PI); ctx.fillStyle = "#2b2b2b"; ctx.fill(); outline(ctx, 5); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(400, 230, 120, 24, 0, 0, Math.PI * 2); ctx.fillStyle = potion; ctx.fill(); outline(ctx, 5); ctx.stroke();
        for (let i = 0; i < 5; i++) { const bx = 330 + i * 35, by = 210 - ((bubble * 40 + i * 23) % 60); ctx.globalAlpha = .7; circle(ctx, bx, by, 6 + (i % 3) * 2, potion, 2); } ctx.globalAlpha = 1;
        rrect(ctx, 300, 300, 18, 30, 4, "#2b2b2b", 3); rrect(ctx, 482, 300, 18, 30, 4, "#2b2b2b", 3);
        text(ctx, msg, 400, 70, 28, phase === "input" ? "#ffe14a" : "#fff");
        JARS.forEach((jr, i) => {
          const lit = glow === i && glowT > 0;
          if (lit) { ctx.globalAlpha = .5; circle(ctx, jr.x, Y, R + 30, jr.c, 0); ctx.globalAlpha = 1; }
          rrect(ctx, jr.x - R * .75, Y - R, R * 1.5, R * 2, 18, lit ? "#ffffff" : jr.c, 5);
          rrect(ctx, jr.x - R * .55, Y - R - 22, R * 1.1, 24, 6, "#8b5a2b", 4);
          circle(ctx, jr.x - 14, Y - 10, 10, "rgba(255,255,255,.5)", 0);
        });
        drawSparkles(ctx, fx);
      }
    };
  }

  /* =====================================================================
     5. ROOFTOP RUN — tap to jump the gaps and catch the monkey
     ===================================================================== */
  function rooftop(api) {
    const DUR = 28, GR = 1900, JV = -760, speed = api.easy ? 230 : 300;
    let t = 0, roofs = [], coins = [], k = { x: 190, y: 0, vy: 0, on: true, jumps: 0 }, score = 0, fx = [], fl = [], respawn = 0, run = 0, over = false, caught = false;
    function addRoof(x) { const gap = api.easy ? rand(70, 120) : rand(100, 170), w = rand(220, 380), y = clamp(rand(400, 480), 380, 500); roofs.push({ x: x + gap, w, y }); if (Math.random() < .8) for (let i = 0; i < 3; i++) coins.push({ x: x + gap + w * (.25 + i * .25), y: y - rand(90, 170), got: false }); return x + gap + w; }
    let edge = -50; roofs.push({ x: -50, w: 600, y: 450 }); edge = 550; while (edge < W + 400) edge = addRoof(edge);
    k.y = 450;
    return {
      hud: () => [`Pieces of eight: ${score}`, `Catch the monkey! ${Math.max(0, Math.ceil(DUR - t))}`],
      down() { if (respawn > 0 || over) return; const max = api.easy ? 2 : 1; if (k.on || k.jumps < max) { k.vy = JV; k.on = false; k.jumps++; api.sfx("jump"); } },
      move() {}, up() {},
      update(dt) {
        if (over) return;
        t += dt; run += dt; updSparkles(fx, dt); floaters(fl, dt);
        const dx = speed * dt;
        for (const r of roofs) r.x -= dx; for (const c of coins) c.x -= dx; edge -= dx;
        roofs = roofs.filter(r => r.x + r.w > -60); coins = coins.filter(c => c.x > -40);
        while (edge < W + 400) edge = addRoof(edge);
        if (respawn > 0) { respawn -= dt; if (respawn <= 0) { const r = roofs.find(rf => rf.x > 120 && rf.x < 400) || roofs[1]; k.y = r.y - 200; k.x = Math.max(r.x + 40, 190); k.vy = 0; } }
        else {
          const prevY = k.y; k.vy += GR * dt; k.y += k.vy * dt; k.on = false;
          for (const r of roofs) if (k.x > r.x && k.x < r.x + r.w && prevY <= r.y && k.y >= r.y) { k.y = r.y; k.vy = 0; k.on = true; k.jumps = 0; }
          k.x += (190 - k.x) * dt;
          if (k.y > H + 80) { respawn = .7; api.sfx("plop"); fl.push({ s: "Whoops!", x: 200, y: 300, life: 1, col: "#ff9b8b" }); }
          for (const c of coins) if (!c.got && dist(c.x, c.y, k.x, k.y - 50) < 50) { c.got = true; score++; api.sfx("coin"); sparkles(fx, c.x, c.y, 6, "#e6ecf4"); }
        }
        if (t >= DUR) { over = true; caught = true; score += 3; api.sfx("cheer"); setTimeout(() => api.end(Math.min(20, score), `Gotcha! You grabbed the monkey's tail, and ${score} pieces of eight on the way.`), 900); }
      },
      draw(ctx) {
        for (const r of roofs) {
          rrect(ctx, r.x, r.y, r.w, H - r.y + 20, 0, "#5a3a2a", 4);
          ctx.beginPath(); ctx.moveTo(r.x - 10, r.y); ctx.lineTo(r.x + r.w + 10, r.y); ctx.lineTo(r.x + r.w, r.y - 18); ctx.lineTo(r.x, r.y - 18); ctx.closePath(); ctx.fillStyle = "#8a3a2a"; ctx.fill(); outline(ctx, 4); ctx.stroke();
          for (let wx = r.x + 30; wx < r.x + r.w - 40; wx += 90) rrect(ctx, wx, r.y + 40, 34, 40, 4, "#ffcf6b", 3);
        }
        for (const c of coins) if (!c.got) coin8(ctx, c.x, c.y, 18, t * 5 + c.x);
        /* monkey ahead */
        const mx = caught ? 260 : 620 - (t / DUR) * 300, my = 200 + Math.abs(Math.sin(t * 6)) * -40;
        circle(ctx, mx, my, 22, "#8b5a2b", 4); circle(ctx, mx, my - 34, 20, "#8b5a2b", 4); circle(ctx, mx, my - 30, 13, "#e8c49a", 0);
        circle(ctx, mx - 5, my - 34, 2.5, "#000", 0); circle(ctx, mx + 5, my - 34, 2.5, "#000", 0);
        rrect(ctx, mx - 15, my - 16, 30, 22, 6, "#b8372b", 3);
        coin8(ctx, mx + 30, my - 10, 12, t * 6);
        if (respawn <= 0) kid(ctx, k.x, k.y, "#c9502e", "#1a1a1a", 1, k.on ? run * 14 : 1.2);
        drawSparkles(ctx, fx); drawFloaters(ctx, fl);
        if (t < 3) text(ctx, api.easy ? "Tap to jump. Tap again in the air for a double jump!" : "Tap to jump the gaps!", 400, 80, 26);
      }
    };
  }

  /* =====================================================================
     6. COIN CATCH — drag the hat, catch chocolate coins, dodge rotten fish
     ===================================================================== */
  function coinCatch(api) {
    const DUR = 30, HW = api.easy ? 150 : 110;
    let t = 0, hx = 400, tx = 400, score = 0, drops = [], spawn = .3, stun = 0, fx = [], fl = [], over = false;
    return {
      hud: () => [`Chocolate coins: ${score}`, `⏱ ${Math.max(0, Math.ceil(DUR - t))}`],
      down(x) { tx = x; }, move(x) { tx = x; }, up() {},
      update(dt) {
        if (over) return;
        t += dt; stun -= dt; updSparkles(fx, dt); floaters(fl, dt);
        if (stun <= 0) hx += (clamp(tx, 80, 720) - hx) * Math.min(1, dt * 12);
        spawn -= dt;
        if (spawn <= 0) { const r = Math.random(); drops.push({ k: r < .68 ? "choc" : r < .9 ? "fish" : "banana", x: rand(50, 750), y: -30, vy: rand(160, 240) * (api.easy ? .8 : 1.1), rot: rand(0, 6) }); spawn = (api.easy ? .6 : .45) - t * .004; }
        for (const d of drops) {
          d.y += d.vy * dt; d.rot += dt * 3;
          if (!d.gone && d.y > 470 && d.y < 530 && Math.abs(d.x - hx) < HW / 2) {
            d.gone = true;
            if (d.k === "fish") { stun = .8; score = Math.max(0, score - 1); api.sfx("splat"); fl.push({ s: "Pee-yew!", x: hx, y: 420, life: 1, col: "#a8e07a" }); }
            else { const v = d.k === "banana" ? 2 : 1; score += v; api.sfx("coin"); sparkles(fx, d.x, 480, 6, "#ffe17a"); fl.push({ s: "+" + v, x: d.x, y: 440, life: .7 }); }
          }
        }
        drops = drops.filter(d => d.y < H + 40 && !d.gone);
        if (t >= DUR) { over = true; api.end(Math.min(20, score), `You caught ${score} chocolate coins! Your hat smells a bit fishy, though.`); }
      },
      draw(ctx) {
        for (const d of drops) {
          if (d.k === "choc") { circle(ctx, d.x, d.y, 20, "#f2b632", 4); ctx.beginPath(); ctx.arc(d.x + 4, d.y - 4, 12, -.5, 1.2); ctx.strokeStyle = "#6b3a1c"; ctx.lineWidth = 5; ctx.stroke(); }
          else if (d.k === "fish") { fish(ctx, d.x, d.y, d.rot, .9, "#8fa36b"); ctx.globalAlpha = .7; text(ctx, "~", d.x, d.y - 30, 26, "#a8e07a"); ctx.globalAlpha = 1; }
          else { ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.beginPath(); ctx.moveTo(-20, 6); ctx.quadraticCurveTo(0, 24, 22, -8); ctx.quadraticCurveTo(4, 6, -16, -4); ctx.closePath(); ctx.fillStyle = "#ffe14a"; ctx.fill(); outline(ctx, 3); ctx.stroke(); ctx.restore(); }
        }
        /* hat */
        const wob = stun > 0 ? Math.sin(t * 50) * 6 : 0;
        ctx.save(); ctx.translate(hx + wob, 500);
        ctx.beginPath(); ctx.moveTo(-HW / 2 - 14, 14); ctx.lineTo(HW / 2 + 14, 14); ctx.lineTo(HW / 2, -26); ctx.quadraticCurveTo(0, -50, -HW / 2, -26); ctx.closePath(); ctx.fillStyle = "#1a1a1a"; ctx.fill(); outline(ctx, 4); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -18, 9, 0, Math.PI * 2); ctx.fillStyle = "#e9e2d0"; ctx.fill(); ctx.stroke();
        ctx.restore();
        kid(ctx, hx, 600, "#2f7fb5", "#b8372b", .9);
        drawSparkles(ctx, fx); drawFloaters(ctx, fl);
        if (t < 3) text(ctx, "Drag the hat! Catch chocolate, dodge rotten fish!", 400, 70, 26);
      }
    };
  }

  /* =====================================================================

  function duel(api) {

      hud: () => [`Bonks: ${bonks} / ${WIN}`, ""],
      hearts: () => hearts,
      down(x, y) {
        if (over) return;

        if (phase === "now") { api.sfx("clang"); sparkles(fx, 470, 260, 14, "#fff"); say("BLOCKED!"); phase = "dizzy"; pt = DIZZY; return; }

          if (bonks >= WIN) { phase = "end"; api.sfx("cheer"); finish(true); } else { phase = "idle"; pt = rand(.9, 1.6); }

        const dizzy = phase === "dizzy";
        ctx.beginPath(); ctx.moveTo(-70, -200); ctx.lineTo(70, -200); ctx.lineTo(84, -20); ctx.quadraticCurveTo(40, 6, 0, -14); ctx.quadraticCurveTo(-40, 6, -84, -20); ctx.closePath(); ctx.fillStyle = "#5a8f7e"; ctx.fill(); outline(ctx, 5); ctx.stroke();
        circle(ctx, 0, -250, 46, "#7fb3a2", 5);
        if (dizzy) { text(ctx, "@", -16, -256, 26, "#0a2a22"); text(ctx, "@", 16, -256, 26, "#0a2a22"); }
        else { circle(ctx, -16, -256, 10, "#0a2a22", 0); circle(ctx, 16, -256, 10, "#0a2a22", 0); circle(ctx, -16, -254, 4, "#7ef0c4", 0); circle(ctx, 16, -254, 4, "#7ef0c4", 0); }
        ctx.beginPath(); ctx.moveTo(-50, -232); ctx.quadraticCurveTo(-60, -170, 0, -160); ctx.quadraticCurveTo(60, -170, 50, -232); ctx.quadraticCurveTo(0, -214, -50, -232); ctx.fillStyle = "#4f7f70"; ctx.fill(); outline(ctx, 4); ctx.stroke();

        ctx.save(); ctx.translate(-60, -170); ctx.rotate(-1.2 + raise * 1.1);

        ctx.restore();
        ctx.restore();

        ctx.save(); ctx.translate(320, 470); ctx.rotate(-.6); rrect(ctx, -6, -10, 60, 12, 4, "#3a2a1a", 3); circle(ctx, 76, -4, 26, "#333", 4); ctx.restore();
        if (msgT > 0) text(ctx, msg, 300, 330, 32, "#fff");

      }
    };
  }

  const LIST = { fishFling, torchPanic, reefRun, brew, rooftop, coinCatch, duel };

  /* =====================================================================
     RUNNER — sizes the canvas, runs the loop, routes touches
     ===================================================================== */
  function run(name, host, opts) {
    const canvas = document.createElement("canvas");
    canvas.className = "gamecanvas";
    host.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    let ended = false, raf = 0, last = 0, stopped = false;
    const api = { W, H, easy: opts.easy, flags: opts.flags || {}, sfx: opts.sfx || (() => {}),
      end(pieces, message) { if (ended) return; ended = true; setTimeout(() => opts.onEnd(Math.max(0, Math.round(pieces)), message), 50); } };
    const g = LIST[name](api);

    }

    const ro = window.ResizeObserver ? new ResizeObserver(size) : null; if (ro) ro.observe(host);
    const pos = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
    let downId = null;
    canvas.addEventListener("pointerdown", e => { e.preventDefault(); downId = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch (x) {} g.down(...pos(e)); });
    canvas.addEventListener("pointermove", e => { if (downId === e.pointerId || e.pointerType === "mouse") g.move(...pos(e)); });
    const upH = e => { if (downId === e.pointerId) { g.up(...pos(e)); downId = null; } };
    canvas.addEventListener("pointerup", upH); canvas.addEventListener("pointercancel", upH);
    function frame(ts) {
      if (stopped) return;
      const dt = Math.min(.05, last ? (ts - last) / 1000 : 0); last = ts;
      g.update(dt);
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();
      g.draw(ctx);
      const [l, r] = g.hud();
      rrect(ctx, 10, 10, 330, 46, 12, "rgba(0,0,0,.55)", 0); text(ctx, l, 22, 34, 24, "#fff", "left");
      if (g.hearts) { for (let i = 0; i < 3; i++) heart(ctx, 690 + i * 36, 34, i < g.hearts()); }
      if (r) { rrect(ctx, W - 270 - (g.hearts ? 130 : 0), 10, 260, 46, 12, "rgba(0,0,0,.55)", 0); text(ctx, r, W - 140 - (g.hearts ? 130 : 0), 34, 22, "#fff"); }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return { stop() { stopped = true; cancelAnimationFrame(raf); if (ro) ro.disconnect(); canvas.remove(); } };
  }

  return { run, list: Object.keys(LIST), coin8 };
})();

<script>/* =====================================================================
   MUSIC & SOUND — original tunes played live with Web Audio (no files)
   MUSIC.play("shanty" | "cave" | "sea" | "witch" | "market" | "spooky" | "game" | "dawn")

      { wave: "triangle", gain: .16, decay: .18, n: notes(`D3 . D3 . A2 . A2 . C3 . C3 . G2 . G2 . D3 . D3 . A2 . A2 . C3 . A2 . D3 . . .`) },
      { drum: true, pattern: "k.h.s.h.k.k.s.h.k.h.s.h.k.k.s.h.k.h.s.h.k.k.s.h.k.h.s.h.k.s.s.s" } ] },
    cave: { bpm: 60, sub: 2, vol: 1, voices: [
      { wave: "sine", gain: .14, decay: 2.2, n: notes(`D2 - - - - - - - F2 - - - - - - - C2 - - - - - - - D2 - - - - - - -`) },
      { wave: "triangle", gain: .05, decay: .6, n: notes(`. . A4 . . . . . . F4 . . . . . . . . E4 . . . . G4 . . . . D4 . . .`) },

    sea: { bpm: 76, sub: 2, vol: 1, voices: [
      { wave: "sine", gain: .13, decay: 1.2, n: notes(`D2 - - - A2 - - - Bb1 - - - F2 - - - G2 - - - D2 - - - A1 - - - E2 - - -`) },
      { wave: "triangle", gain: .07, decay: .5, n: notes(`D4 F4 A4 . E4 . A4 . D4 F4 Bb4 . A4 . F4 . G4 Bb4 D5 . A4 . F4 . E4 . C#4 . A3 . . .`) },

    witch: { bpm: 96, sub: 1, vol: 1, voices: [
      { wave: "sine", gain: .09, decay: .5, n: notes(`E5 G5 B5 A5 G5 E5 F#5 A5 C6 B5 A5 F#5 E5 G5 B5 C6 B5 G5 D#5 F#5 B5 A5 F#5 D#5`) },
      { wave: "triangle", gain: .12, decay: .8, n: notes(`E3 . . E3 . . D3 . . D3 . . C3 . . C3 . . B2 . . B2 . .`) } ] },
    market: { bpm: 128, sub: 2, vol: .8, voices: [
      { wave: "square", gain: .055, decay: .14, n: notes(`G5 . E5 G5 . E5 C5 . D5 . E5 F5 G5 . . . A5 . G5 F5 . E5 D5 . C5 . D5 E5 C5 . . .`) },

      { wave: "triangle", gain: .07, decay: .7, n: notes(`D4 F4 A4 C#5 D5 . . . D4 F4 Bb4 D5 C#5 . . . D4 G4 Bb4 D5 F5 . E5 . C#5 . A4 . . . . .`) },

      { wave: "sine", gain: .14, decay: .6, n: notes(`D3 . A3 . D3 . A3 . G2 . D3 . G2 . D3 . D3 . A3 . D3 . A3 . G2 . A2 . D3 . . .`) } ] }

  function play(name) {

    splash: t => noise(t, .45, .35, sfxBus, 2500, .7, "lowpass", 300),

    clang: t => { tone(1400, t, .4, "square", .07, sfxBus); tone(2100, t, .35, "triangle", .08, sfxBus); noise(t, .15, .2, sfxBus, 5000, 2); },
    swish: t => noise(t, .2, .2, sfxBus, 1200, 3, "bandpass", 4000),
    ouch: t => tone(300, t, .3, "sawtooth", .12, sfxBus, 150),
    jump: t => tone(300, t, .18, "square", .07, sfxBus, 700),
    splat: t => { noise(t, .25, .3, sfxBus, 600, .6, "lowpass", 150); tone(180, t, .2, "sawtooth", .08, sfxBus, 90); },
    error: t => { tone(160, t, .25, "sawtooth", .12, sfxBus); tone(150, t + .15, .3, "sawtooth", .12, sfxBus); },
    tick: t => tone(1800, t, .03, "square", .05, sfxBus),
    cheer: t => [0, 4, 7, 12].forEach((s, i) => tone(mtof(74 + s), t + i * .09, .3, "square", .07, sfxBus)),

    lose: t => [7, 5, 3, 0].forEach((s, i) => tone(mtof(62 + s), t + i * .16, .3, "triangle", .12, sfxBus)),

  ["pointerdown", "keydown", "touchend"].forEach(ev => window.addEventListener(ev, unlock, { passive: true }));

  return { play, sfx, duck, setOn, unlock, isOn: () => on };
})();

const PREFIX = ["Barnacle", "Salty", "Stinky-Boots", "Cannonball", "Squid-Lips", "Two-Socks", "Rusty-Hook", "Bilge-Rat",
  "Thunderpants", "Sharkbait", "Pickle-Beard", "Scurvy", "One-Eye", "Peg-Leg", "Mad-Dog", "Seaweed", "Gunpowder", "Crabclaw"];
const SUFFIX = ["the Bold", "the Sneaky", "the Terrible", "of the Seven Snacks", "the Unwashed", "the Fearless",
  "Saltbeard", "the Loud", "the Wobbly", "Stormbringer", "the Slippery", "Bonecrusher", "the Smelly", "Goldtooth"];

function hash(s) { let h = 7; for (const c of s.toLowerCase()) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function makeNames(realA, realB, roll) {
  const ia = (hash(realA) + roll * 5) % PREFIX.length;
  let ib = (hash(realB) + roll * 7 + 3) % PREFIX.length;
  if (ib === ia) ib = (ib + 1) % PREFIX.length;
  const sa = (hash(realA + "x") + roll * 3) % SUFFIX.length;
  let sb = (hash(realB + "y") + roll * 2 + 1) % SUFFIX.length;
  if (sb === sa) sb = (sb + 1) % SUFFIX.length;
  return {
    a: PREFIX[ia] + " " + cap(realA), aFull: PREFIX[ia] + " " + cap(realA) + " " + SUFFIX[sa],
    b: PREFIX[ib] + " " + cap(realB), bFull: PREFIX[ib] + " " + cap(realB) + " " + SUFFIX[sb]
  };
}

/* ---------- Read aloud ---------- */
let voice = null;
function pickVoice() {
  try {
    const vs = window.speechSynthesis.getVoices();
    /* Prefer the most natural-sounding English voice the device has */
    const score = v => {
      if (!/^en/i.test(v.lang)) return -1;
      let n = 0;
      if (/natural|neural|online|premium|enhanced|siri/i.test(v.name)) n += 10;
      if (/google/i.test(v.name)) n += 6;
      if (/en-AU/i.test(v.lang)) n += 3; else if (/en-GB/i.test(v.lang)) n += 2; else n += 1;
      if (/compact|espeak/i.test(v.name)) n -= 5;
      return n;
    };
    voice = vs.filter(v => score(v) >= 0).sort((a, b) => score(b) - score(a))[0] || null;
  } catch (e) {}
}
try { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
/* ---------- Captain Dad's recordings ---------- */
let clip = null, manifest = null;
function loadManifest() {
  if (manifest) return;
  manifest = {};
  try {
    fetch("audio/manifest.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(m => { manifest = m || {}; }).catch(() => {});
  } catch (e) {}
}
function stopSpeech() {
  try { window.speechSynthesis.cancel(); } catch (e) {}
  try { MUSIC.duck(false); } catch (e) {}
  if (clip) { try { clip.pause(); } catch (e) {} clip = null; }
}
function say(parts, clipId) { /* parts: [[speakerKey, text], ...] */
  stopSpeech();
  if (!S.reading) return;
  if (S.narrator === "dad") {
    if (!clipId) return;
    const file = (manifest && manifest[clipId]) || (clipId + ".mp3");
    const a = new Audio("audio/" + file);
    let fell = false;
    const fallback = () => { if (fell || clip !== a) return; fell = true; clip = null; speakTTS(parts); };
    clip = a;
    MUSIC.duck(true);
    a.addEventListener("ended", () => MUSIC.duck(false));
    a.addEventListener("error", fallback);
    try { const pr = a.play(); if (pr && pr.catch) pr.catch(fallback); } catch (e) { fallback(); }
    return;
  }
  speakTTS(parts);
}
function speakTTS(parts) {
  try {
    parts.forEach(([who, text]) => {
      const c = CHARS[who] || CHARS.n;
      const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}☀-➿️‍]/gu, ""));
      u.pitch = c.pitch; u.rate = c.rate; if (voice) u.voice = voice;
      u.onend = () => { setTimeout(() => { try { if (!window.speechSynthesis.speaking) MUSIC.duck(false); } catch (e) {} }, 200); };
      window.speechSynthesis.speak(u);
    });
    if (parts.length) MUSIC.duck(true);
  } catch (e) {}
}
/* When there's only one way forward, cheer them on instead of asking */
const NUDGES = [
  "Ready? Tap \u201c{x}\u201d!",
  "Off you go! Tap \u201c{x}\u201d to keep going.",
  "Let's go, me hearties! Tap \u201c{x}\u201d!",
  "Quick, before it's too late! Tap \u201c{x}\u201d!",
  "What are you waiting for? Tap \u201c{x}\u201d!"
];
function nudgeFor(id, label) {
  let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  let line = NUDGES[h % NUDGES.length].replace("{x}", label);
  if (/[!?]$/.test(label)) line = line.replace(/\u201d!$/, "\u201d");
  return line;
}
function choiceSpeech(list, id) {
  if (!list.length) return [];
  if (list.length === 1) return [["n", nudgeFor(id || S.node, list[0].label)]];
  return [["n", "What will you do? " + list.map((c, i) => (i + 1) + ". " + c.label + ".").join(" ")]];
}

const SPOTS = [[17, 32], [83, 60], [13, 72], [86, 26]];
function drawScene(scene, art) {
  const s = el("div", "scene " + scene);
  if (["dusk", "port", "sea", "alley", "fog"].includes(scene)) s.appendChild(el("div", "moon"));
  art.forEach((emoji, i) => {

    s.appendChild(a);
  });
  if (["fog", "ghost", "sea", "port", "light"].includes(scene)) s.appendChild(el("div", "mist"));
  if (["ghost", "cave", "light", "dawn"].includes(scene)) {
    for (let i = 0; i < 6; i++) { const sp = el("div", "sparkle", scene === "ghost" ? "✦" : "✨"); sp.style.color = "#7ef0c4"; sp.style.left = (6 + Math.random() * 88) + "%"; sp.style.top = (6 + Math.random() * 70) + "%"; sp.style.animationDelay = (Math.random() * 2) + "s"; sp.setAttribute("aria-hidden", "true"); s.appendChild(sp); }
  }
  return s;
}

function drawPic(node) {
  if (!node.pic) return drawScene(node.scene, node.art);
  const s = el("div", "scene");
  const label = ((node.text || (node.lines ? node.lines[0][1] : "")) + "").split("\n")[0].slice(0, 120);
  let pic = node.pic;
  if (S.flags.noLantern && pic.parts) pic = Object.assign({}, pic, { parts: pic.parts.map(p => p.startsWith("boat@") ? p.replace("boat@", "boat:dark@") : p) });
  s.innerHTML = ART.scene(pic, fill(label));
  return s;
}

/* ---------- Navigation ---------- */
function snapshot() { return { node: S.node, items: S.items.slice(), visited: S.visited.slice(), hours: S.hours, lastPlace: S.lastPlace, flags: Object.assign({}, S.flags) }; }
function goTo(id, opts = {}) {
  if (S.node && !opts.noHistory) S.history.push(snapshot());
  if (opts.give && !S.items.includes(opts.give)) S.items.push(opts.give);
  if (opts.cost) S.hours += opts.cost;
  if (opts.flag) S.flags[opts.flag] = true;
  if (id === "map" && S.hours >= HOURS) id = "midnight";
  S.node = id;
  render();
}
function enterPlace(p) {
  S.history.push(snapshot());
  S.visited.push(p.id); S.hours += 1; S.lastPlace = p.id;
  S.node = p.start; render();
}

function trackFor(node) {
  if (!node || node.type === "map") return "shanty";
  if (node.type === "game") return "game";
  if (node.type === "ending") return "dawn";
  const p = node.pic || {};
  return ({ harbour: p.mode === "fog" ? "spooky" : "shanty", skullRock: "cave", cave: "cave", reef: "sea", lighthouse: "witch", alley: "market", ghostShip: "spooky", deck: p.mode === "dawn" ? "dawn" : "spooky", dawnSea: "dawn" })[p.bg] || "shanty";
}
function render() {
  clearTimers(); stopSpeech();
  if (game) { game.stop(); game = null; }
  const node = STORY[S.node];
  const arr = v => v ? [].concat(v) : [];
  if (node.type !== "game") {
    arr(node.take).forEach(it => { S.items = S.items.filter(x => x !== it); });
    arr(node.give).forEach(it => { if (!S.items.includes(it)) S.items.push(it); });
  }
  MUSIC.play(trackFor(node));
  if (node.type === "ending") MUSIC.sfx("win");
  book.innerHTML = "";
  if (node.type === "map") renderMap();
  else if (node.type === "chat") renderChat(node);
  else if (node.type === "game") renderGame(node);
  else renderPage(node);
  backBtn.disabled = S.history.length === 0;
  drawShelf();
  try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {}
}

function makeChoices(node) {
  const box = el("div", "choices");

  list.forEach((c, i) => {

    b.appendChild(el("span", "em", c.em)); b.appendChild(el("span", null, c.label));
    const n = el("span", "num", String(i + 1)); n.setAttribute("aria-hidden", "true"); b.appendChild(n);
    b.addEventListener("click", () => { MUSIC.sfx("page"); c.action ? c.action() : goTo(c.to, { give: c.give, cost: c.cost, flag: c.flag }); });

  return { box, list };
}

function renderChat(node) {
  const wrap = el("div", "page");
  wrap.appendChild(drawPic(node));
  const content = el("div", "content");
  const chat = el("div", "chat");
  const skip = el("button", "skip", "Show all ⏩"); skip.type = "button";
  content.appendChild(skip);
  content.appendChild(chat);
  const { box, list } = makeChoices(node);
  box.style.visibility = "hidden";
  content.appendChild(box);
  wrap.appendChild(content);
  book.appendChild(wrap);

  const lines = node.lines.map(([who, t]) => [who, fill(t)]);
  let shown = 0, typing = null;
  function addLine(i) {
    if (typing) { typing.remove(); typing = null; }
    const [who, text] = lines[i];
    const c = CHARS[who] || CHARS.n;
    if (who === "n") { chat.appendChild(el("div", "narr", text)); return; }
    const m = el("div", "msg " + (c.side === "right" ? "right " : "left ") + (c.cls || ""));
    m.appendChild(el("div", "avatar", c.av));
    const bub = el("div", "bubble");
    bub.appendChild(el("span", "who", fill(c.name)));
    bub.appendChild(document.createTextNode(text));
    m.appendChild(bub);
    chat.appendChild(m);
  }
  function finish() {
    clearTimers();
    while (shown < lines.length) addLine(shown++);
    if (typing) { typing.remove(); typing = null; }
    box.style.visibility = "visible"; skip.style.display = "none";
  }
  function step() {
    if (shown >= lines.length) { finish(); return; }
    addLine(shown++);
    if (shown >= lines.length) { finish(); return; }
    const next = lines[shown];
    if (next[0] !== "n" && (CHARS[next[0]] || {}).side !== "right") { typing = el("div", "typing", "•••"); chat.appendChild(typing); }
    const wait = Math.min(3400, 900 + lines[shown - 1][1].length * (S.reading ? 55 : 28));
    timers.push(setTimeout(step, wait));
  }
  skip.addEventListener("click", finish);
  chat.addEventListener("click", finish);
  step();
  say(lines.concat(choiceSpeech(list, S.node)), S.node);
}

function renderGame(node) {
  const wrap = el("div", "page");
  const stage = el("div", "stage");
  stage.innerHTML = ART.scene(node.pic || { bg: "harbour", mode: "dusk" }, node.title);
  const host = el("div", "gamehost"); stage.appendChild(host);
  const over = el("div", "overlay"); stage.appendChild(over);
  wrap.appendChild(stage);
  book.appendChild(wrap);

  function intro() {
    over.innerHTML = ""; over.style.display = "flex";
    over.appendChild(el("div", "gtitle", node.title));
    over.appendChild(el("p", "ghow", fill(node.how)));
    const lvl = el("div", "lvl");
    [["easy", "🐣 Easy"], ["hard", "🦈 Hard"]].forEach(([k, label]) => {
      const b = el("button", "lvlbtn", label); b.type = "button";
      b.setAttribute("aria-pressed", String((k === "hard") === S.hard));
      b.addEventListener("click", () => { S.hard = k === "hard"; store.set("hard", S.hard); lvl.querySelectorAll(".lvlbtn").forEach((x, i) => x.setAttribute("aria-pressed", String((i === 1) === S.hard))); });
      lvl.appendChild(b);
    });
    over.appendChild(lvl);
    const play = el("button", "bigbtn", "Play! ▶"); play.type = "button";
    play.addEventListener("click", start);
    over.appendChild(play);
    if (window.innerWidth < 620 && window.innerHeight > window.innerWidth) over.appendChild(el("div", "tiltTip", "📱 Tip: turn your phone sideways for a bigger game!"));
    const skip = el("button", "skipgame", "Skip the game"); skip.type = "button";
    skip.addEventListener("click", carryOn);
    over.appendChild(skip);
    say([["n", node.title + ". " + fill(node.how)]], S.node);
  }
  function start() {
    stopSpeech(); MUSIC.unlock();
    over.style.display = "none";
    try { stage.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {}
    if (game) game.stop();
    game = GAMES.run(node.game, host, { easy: !S.hard, flags: S.flags, sfx: MUSIC.sfx, onEnd: result });
  }
  function result(pieces, message) {
    if (game) { game.stop(); game = null; }
    const id = S.node, before = S.eight[id] || 0;
    S.eight[id] = Math.max(before, pieces);
    const gained = S.eight[id] - before;
    MUSIC.sfx(pieces > 0 ? "win" : "lose");
    over.innerHTML = ""; over.style.display = "flex";
    over.appendChild(el("div", "gtitle", pieces > 0 ? "Arrr, well done!" : "Good try!"));
    over.appendChild(el("p", "ghow", message));
    const won = el("div", "won");
    won.innerHTML = `<span>+ ${P8(pieces)} pieces of eight</span>` + (before && gained === 0 ? `<span class="best">(Your best here is ${before})</span>` : "");
    over.appendChild(won);
    const row = el("div", "row");
    const again = el("button", "bigbtn alt", "🔁 Have another go"); again.type = "button"; again.addEventListener("click", start);
    const go = el("button", "bigbtn", "Carry on ▶"); go.type = "button"; go.addEventListener("click", carryOn);
    row.appendChild(again); row.appendChild(go); over.appendChild(row);
    if (S.reading && S.narrator === "computer") speakTTS([["n", message]]);
  }
  function carryOn() { MUSIC.sfx("page"); goTo(node.next, { give: node.give }); }
  intro();
}
