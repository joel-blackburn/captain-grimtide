<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Curse of Captain Grimtide (3D beta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root { --navy: #1b1f3b; --pink: #ff4f8b; --orange: #ff8a3d; --yellow: #ffd23f; --blue: #3a86ff; --mint: #06d6a0; --purple: #9b5de5; --red: #e63946; --paper: #fff8ec; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--navy); font-family: Nunito, system-ui, sans-serif; color: var(--navy); }
  #world { position: fixed; inset: 0; }
  #world canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  .bungee { font-family: Bungee, Impact, sans-serif; font-weight: 400; }

  /* top bar */
  #top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .tb { display: flex; gap: 6px; }
  .tbtn { font: inherit; font-weight: 900; font-size: 15px; border: 3px solid var(--navy); background: #fff; color: var(--navy); border-radius: 14px; padding: 7px 10px; box-shadow: 0 4px 0 var(--navy); cursor: pointer; }
  .tbtn[aria-pressed="true"] { background: var(--yellow); }
  .tbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
  .badge { font-family: Bungee, sans-serif; font-size: 11px; background: var(--pink); color: #fff; border: 3px solid var(--navy); border-radius: 10px; padding: 4px 8px; box-shadow: 0 3px 0 var(--navy); }
  #hud { display: none; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { font-weight: 900; font-size: 15px; background: #fff; border: 3px solid var(--navy); border-radius: 999px; padding: 4px 12px; box-shadow: 0 3px 0 var(--navy); display: flex; align-items: center; gap: 6px; }
  .pip { width: 16px; height: 16px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--navy); display: inline-block; }
  .pip.gone { background: #4a4f73; }
  .p8 { display: inline-grid; place-items: center; width: 1.4em; height: 1.4em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9ced6); border: 2px solid var(--navy); font-weight: 900; font-size: .85em; color: #4a4f73; }

  /* narration caption */
  #caption { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 56px); left: 50%; transform: translateX(-50%); width: min(680px, calc(100% - 24px));
    background: var(--paper); border: 4px solid var(--navy); border-radius: 20px; padding: 14px 18px; font-size: clamp(18px, 2.4vw, 23px); line-height: 1.45; font-weight: 800;
    box-shadow: 0 6px 0 var(--navy); display: none; }
  #caption.show { display: block; animation: pop .25s ease; }

  /* speech bubble */
  #bubble { position: absolute; left: 0; top: 0; width: max-content; max-width: min(420px, 82vw); background: #fff; border: 4px solid var(--navy); border-radius: 22px; padding: 10px 16px 12px;
    font-size: clamp(18px, 2.3vw, 22px); line-height: 1.4; font-weight: 800; box-shadow: 0 6px 0 var(--navy); display: none; transform: translate(-50%, -100%); }
  #bubble.show { display: block; }
  #bubble .who { display: inline-block; font-family: Bungee, sans-serif; font-size: 12px; color: #fff; background: var(--navy); border-radius: 8px; padding: 2px 8px; margin-bottom: 4px; }
  #bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -18px; transform: translateX(-50%); border: 14px solid transparent; border-top: 18px solid var(--navy); }
  #bubble::before { content: ""; position: absolute; left: var(--tail, 50%); bottom: -9px; transform: translateX(-50%); border: 10px solid transparent; border-top: 13px solid #fff; z-index: 1; }

  /* choices & next */
  #choices { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(620px, calc(100% - 24px)); display: none; flex-direction: column; gap: 10px; }
  #choices.show { display: flex; animation: rise .3s ease; }
  .choice { font: inherit; font-family: Bungee, sans-serif; font-size: clamp(15px, 2.2vw, 19px); text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 18px;
    border: 4px solid var(--navy); color: #fff; background: var(--pink); box-shadow: 0 6px 0 var(--navy); cursor: pointer; }
  .choice:nth-child(2) { background: var(--blue); } .choice:nth-child(3) { background: var(--purple); }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--navy); }
  .choice .em { font-size: 1.5em; }
  .choice.solo { animation: nudge 1.8s ease-in-out 1s infinite; }
  #next { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 74px; height: 74px; border-radius: 50%; font-size: 30px; border: 4px solid var(--navy);
    background: var(--yellow); box-shadow: 0 6px 0 var(--navy); cursor: pointer; display: none; animation: nudge 1.6s ease-in-out infinite; color: var(--navy); }
  #next.show { display: block; }
  @keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes pop { from { opacity: 0; transform: translateX(-50%) scale(.9); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* panels (start, game intro, results) */
  .panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 100px); overflow-y: auto;
    background: var(--paper); border: 5px solid var(--navy); border-radius: 26px; padding: 22px; box-shadow: 0 8px 0 var(--navy); text-align: center; display: none; }
  .panel.show { display: block; }
  .panel h1 { font-family: Bungee, sans-serif; font-weight: 400; font-size: clamp(24px, 5vw, 38px); margin: 0 0 4px; line-height: 1.05; color: var(--navy); }
  .panel h1 .accent { color: var(--pink); }
  .panel h2 { font-family: Bungee, sans-serif; font-weight: 400; font-size: clamp(22px, 4vw, 30px); margin: 0 0 8px; color: var(--pink); }
  .panel p { font-size: 18px; line-height: 1.45; margin: 6px 0 14px; font-weight: 700; }
  .big { font: inherit; font-family: Bungee, sans-serif; font-size: 20px; padding: 14px 26px; border-radius: 999px; border: 4px solid var(--navy); background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--navy); cursor: pointer; }
  .big.alt { background: #fff; color: var(--navy); }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--navy); }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 14px; }
  .pickcard { font: inherit; text-align: left; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; border: 3px solid var(--navy); background: #fff; box-shadow: 0 4px 0 var(--navy); cursor: pointer; color: var(--navy); }
  .pickcard[aria-pressed="true"] { background: var(--yellow); }
  .pickcard .pe { font-size: 30px; } .pickcard strong { font-family: Bungee, sans-serif; font-weight: 400; font-size: 16px; display: block; } .pickcard span { font-size: 13px; font-weight: 700; }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; text-align: left; }
  .names label { font-weight: 900; font-size: 14px; }
  .names input { font: inherit; font-size: 20px; font-weight: 800; width: 100%; padding: 10px 12px; border-radius: 14px; border: 3px solid var(--navy); margin-top: 3px; }
  .err { color: var(--red); font-weight: 900; min-height: 20px; margin: 4px 0; }
  .pname { background: #fff; border: 3px solid var(--navy); border-radius: 16px; padding: 10px; margin: 8px 0; }
  .pname .real { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; opacity: .6; }
  .pname .pir { font-family: Bungee, sans-serif; font-size: clamp(20px, 4.5vw, 28px); }
  .pname.a .pir { color: var(--blue); } .pname.b .pir { color: var(--orange); }
  .lvl { display: flex; gap: 8px; justify-content: center; margin: 4px 0 14px; }
  .lvlbtn { font: inherit; font-weight: 900; font-size: 16px; padding: 8px 14px; border-radius: 999px; border: 3px solid var(--navy); background: #fff; cursor: pointer; box-shadow: 0 3px 0 var(--navy); }
  .lvlbtn[aria-pressed="true"] { background: var(--yellow); }
  .skip { font: inherit; background: none; border: 0; text-decoration: underline; font-weight: 700; color: #4a4f73; margin-top: 10px; cursor: pointer; }
  .won { font-size: 26px; font-weight: 900; margin: 6px 0; }

  /* game HUD */
  #ghud { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 58px); left: 50%; transform: translateX(-50%); display: none; gap: 8px; }
  #ghud.show { display: flex; }
  #ghint { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-family: Bungee, sans-serif; font-size: clamp(14px, 2.4vw, 20px); color: #fff; text-shadow: 0 3px 0 var(--navy), 0 0 10px var(--navy); display: none; text-align: center; width: 90%; pointer-events: none; }
  #ghint.show { display: block; }
  .pop { position: absolute; font-family: Bungee, sans-serif; font-size: 28px; color: var(--yellow); text-shadow: 0 3px 0 var(--navy); pointer-events: none; transform: translate(-50%, -50%); animation: floatup 1s ease forwards; }
  @keyframes floatup { to { transform: translate(-50%, -150%); opacity: 0; } }

  /* map labels */
  .place { position: absolute; transform: translate(-50%, -100%); font: inherit; font-family: Bungee, sans-serif; font-size: clamp(13px, 2vw, 17px); display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: #fff; border: 3px solid var(--navy); border-radius: 16px; padding: 6px 10px; box-shadow: 0 4px 0 var(--navy); cursor: pointer; color: var(--navy); white-space: nowrap; }
  .place .pe { font-size: 32px; line-height: 1; }
  .place:active { transform: translate(-50%, -96%); }
  .place.here { background: var(--yellow); }
  #mapbar { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; }
  #mapbar.show { display: block; }
  #fade { position: fixed; inset: 0; background: var(--navy); opacity: 0; pointer-events: none; transition: opacity .5s; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--navy); color: #fff; font-family: Bungee, sans-serif; font-size: 22px; text-align: center; padding: 20px; }
  @media (max-width: 560px) { .pick, .names { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="world"></div>
<div class="ui" id="ui">
  <div id="top">
    <div class="tb">
      <button class="tbtn" id="readBtn" aria-pressed="false">🔈 Read</button>
      <button class="tbtn" id="musicBtn" aria-pressed="true">🎵</button>
      <button class="tbtn" id="homeBtn" aria-label="Start again">🏠</button>
      <span class="badge">3D BETA</span>
    </div>
    <div id="hud"></div>
  </div>
  <div id="caption"></div>
  <div id="bubble"><span class="who"></span><div class="txt"></div></div>
  <div id="ghud"></div>
  <div id="ghint"></div>
  <div id="choices"></div>
  <button id="next" aria-label="Next">▶</button>
  <div id="labels"></div>
  <div id="mapbar"></div>
  <div class="panel" id="panel"></div>
</div>
<div id="fade"></div>
<div id="loading">Raising the sails...</div>

<script>/* =====================================================================
   MUSIC & SOUND — original tunes played live with Web Audio (no files)
   MUSIC.play("shanty" | "cave" | "sea" | "witch" | "market" | "spooky" | "game" | "dawn")
   MUSIC.sfx("coin" | "splash" | ...), MUSIC.duck(true/false), MUSIC.setOn(bool)
   ===================================================================== */
const MUSIC = (() => {
  let ac = null, master, musicBus, sfxBus, on = true, current = null, wanted = null, timer = null, nextT = 0, step = 0, ducked = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const N = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  /* "D4 F4 A4 -" style note strings; "-" holds, "." rests */
  const notes = s => s.trim().split(/\s+/).map(t => {
    if (t === "." || t === "-") return t;
    const m = t.match(/^([A-G])(#|b)?(\d)$/); if (!m) return ".";
    return 12 * (+m[3] + 1) + N[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  });

  /* ---------- the tunes (all original) ---------- */
  const TRACKS = {
    shanty: { bpm: 112, sub: 2, vol: .9, voices: [
      { wave: "square", gain: .07, decay: .22, n: notes(`D5 - A4 D5 F5 - E5 D5 C5 - A4 - D5 - A4 D5 F5 - G5 F5 E5 - - - F5 - E5 D5 C5 - A4 C5 D5 - F5 E5 D5 - - -`) },
      { wave: "triangle", gain: .16, decay: .3, n: notes(`D3 . A2 . D3 . A2 . C3 . G2 . C3 . G2 . D3 . A2 . D3 . A2 . C3 . G2 . A2 . E2 . D3 . A2 . C3 . A2 . D3 . . .`) },
      { drum: true, pattern: "k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.h" } ] },
    game: { bpm: 150, sub: 2, vol: .8, voices: [
      { wave: "square", gain: .06, decay: .14, n: notes(`D5 F5 A5 F5 D5 F5 A5 F5 C5 E5 G5 E5 C5 E5 G5 E5 D5 F5 A5 F5 D5 F5 A5 D6 C6 A5 G5 E5 D5 - - -`) },
      { wave: "triangle", gain: .16, decay: .18, n: notes(`D3 . D3 . A2 . A2 . C3 . C3 . G2 . G2 . D3 . D3 . A2 . A2 . C3 . A2 . D3 . . .`) },
      { drum: true, pattern: "k.h.s.h.k.k.s.h.k.h.s.h.k.k.s.h.k.h.s.h.k.k.s.h.k.h.s.h.k.s.s.s" } ] },
    cave: { bpm: 60, sub: 2, vol: 1, voices: [
      { wave: "sine", gain: .14, decay: 2.2, n: notes(`D2 - - - - - - - F2 - - - - - - - C2 - - - - - - - D2 - - - - - - -`) },
      { wave: "triangle", gain: .05, decay: .6, n: notes(`. . A4 . . . . . . F4 . . . . . . . . E4 . . . . G4 . . . . D4 . . .`) },
      { drip: true, every: 7 } ] },
    sea: { bpm: 76, sub: 2, vol: 1, voices: [
      { wave: "sine", gain: .13, decay: 1.2, n: notes(`D2 - - - A2 - - - Bb1 - - - F2 - - - G2 - - - D2 - - - A1 - - - E2 - - -`) },
      { wave: "triangle", gain: .07, decay: .5, n: notes(`D4 F4 A4 . E4 . A4 . D4 F4 Bb4 . A4 . F4 . G4 Bb4 D5 . A4 . F4 . E4 . C#4 . A3 . . .`) },
      { swell: true } ] },
    witch: { bpm: 96, sub: 1, vol: 1, voices: [
      { wave: "sine", gain: .09, decay: .5, n: notes(`E5 G5 B5 A5 G5 E5 F#5 A5 C6 B5 A5 F#5 E5 G5 B5 C6 B5 G5 D#5 F#5 B5 A5 F#5 D#5`) },
      { wave: "triangle", gain: .12, decay: .8, n: notes(`E3 . . E3 . . D3 . . D3 . . C3 . . C3 . . B2 . . B2 . .`) } ] },
    market: { bpm: 128, sub: 2, vol: .8, voices: [
      { wave: "square", gain: .055, decay: .14, n: notes(`G5 . E5 G5 . E5 C5 . D5 . E5 F5 G5 . . . A5 . G5 F5 . E5 D5 . C5 . D5 E5 C5 . . .`) },
      { wave: "triangle", gain: .15, decay: .2, n: notes(`C3 . G2 . C3 . G2 . F2 . C3 . G2 . D3 . F2 . C3 . A2 . F2 . G2 . D3 . C3 . G2 .`) },
      { drum: true, pattern: "k.h.s.hhk.h.s.h.k.h.s.hhk.h.s.s." } ] },
    spooky: { bpm: 66, sub: 2, vol: 1, voices: [
      { wave: "triangle", gain: .07, decay: .7, n: notes(`D4 F4 A4 C#5 D5 . . . D4 F4 Bb4 D5 C#5 . . . D4 G4 Bb4 D5 F5 . E5 . C#5 . A4 . . . . .`) },
      { wave: "sine", gain: .14, decay: 2.5, n: notes(`D2 - - - - - - - Bb1 - - - - - - - G1 - - - - - - - A1 - - - - - - -`) },
      { bell: true, every: 16 } ] },
    dawn: { bpm: 100, sub: 2, vol: .9, voices: [
      { wave: "triangle", gain: .09, decay: .4, n: notes(`D5 . F#5 . A5 - - . G5 . F#5 . E5 - - . D5 . E5 . F#5 . A5 . B5 - A5 . F#5 - - .`) },
      { wave: "sine", gain: .14, decay: .6, n: notes(`D3 . A3 . D3 . A3 . G2 . D3 . G2 . D3 . D3 . A3 . D3 . A3 . G2 . A2 . D3 . . .`) } ] }
  };

  function ensure() {
    if (ac) return true;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
      musicBus = ac.createGain(); musicBus.gain.value = on ? .55 : 0; musicBus.connect(master);
      sfxBus = ac.createGain(); sfxBus.gain.value = .8; sfxBus.connect(master);
      return true;
    } catch (e) { ac = null; return false; }
  }
  function unlock() { if (!ensure()) return; if (ac.state === "suspended") ac.resume(); if (wanted && !current) start(wanted); }

  function tone(freq, t, dur, wave, gain, bus, slideTo) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = wave; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .05);
  }
  let noiseBuf = null;
  function noise(t, dur, gain, bus, freq = 1000, q = 1, type = "bandpass", sweepTo) {
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + dur + .05);
  }
  function drum(ch, t) {
    if (ch === "k") tone(110, t, .18, "sine", .5, musicBus, 40);
    else if (ch === "s") noise(t, .12, .22, musicBus, 1800, .8);
    else if (ch === "h") noise(t, .04, .08, musicBus, 7000, 1, "highpass");
  }

  function start(name) {
    stopLoop();
    const tr = TRACKS[name]; if (!tr || !ac) return;
    current = name; step = 0; nextT = ac.currentTime + .1;
    const stepDur = 60 / tr.bpm / tr.sub;
    const len = Math.max(...tr.voices.filter(v => v.n || v.pattern).map(v => v.n ? v.n.length : v.pattern.length));
    timer = setInterval(() => {
      while (nextT < ac.currentTime + .25) {
        for (const v of tr.voices) {
          if (v.n) {
            const n = v.n[step % v.n.length];
            if (typeof n === "number") {
              let hold = 1; while (v.n[(step + hold) % v.n.length] === "-" && hold < 8) hold++;
              tone(mtof(n), nextT, Math.max(v.decay, stepDur * hold * .95), v.wave, v.gain * tr.vol, musicBus);
            }
          } else if (v.drum) { const ch = v.pattern[step % v.pattern.length]; if (ch !== ".") drum(ch, nextT); }
          else if (v.drip && step % v.every === 0 && Math.random() < .7) tone(rand(1200, 1800), nextT, .12, "sine", .05, musicBus, 600);
          else if (v.bell && step % v.every === 0) { tone(mtof(62), nextT, 2.5, "sine", .08, musicBus); tone(mtof(62) * 2.76, nextT, 1.5, "sine", .03, musicBus); }
          else if (v.swell && step % 16 === 0) noise(nextT, 3, .05, musicBus, 400, .5, "lowpass", 1200);
        }
        nextT += stepDur; step = (step + 1) % (len * 4);
      }
    }, 60);
  }
  function stopLoop() { if (timer) clearInterval(timer); timer = null; current = null; }
  const rand = (a, b) => a + Math.random() * (b - a);

  function play(name) {
    wanted = name;
    if (!ac || ac.state !== "running") return;
    if (current === name) return;
    /* quick fade between tunes */
    const g = musicBus.gain, t = ac.currentTime, target = on ? (ducked ? .15 : .55) : 0;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + .25);
    setTimeout(() => { start(name); const t2 = ac.currentTime; g.cancelScheduledValues(t2); g.setValueAtTime(0, t2); g.linearRampToValueAtTime(target, t2 + .6); }, 260);
  }

    coin: t => { tone(1320, t, .08, "square", .08, sfxBus); tone(1980, t + .07, .18, "square", .08, sfxBus); },
    splash: t => noise(t, .45, .35, sfxBus, 2500, .7, "lowpass", 300),
    plop: t => tone(420, t, .2, "sine", .3, sfxBus, 120),
    whoosh: t => noise(t, .3, .25, sfxBus, 400, 2, "bandpass", 2400),
    fizz: t => noise(t, .5, .12, sfxBus, 5000, 1, "highpass"),
    bonk: t => { tone(320, t, .25, "sine", .45, sfxBus, 90); noise(t, .05, .2, sfxBus, 900); },

    jump: t => tone(300, t, .18, "square", .07, sfxBus, 700),
    splat: t => { noise(t, .25, .3, sfxBus, 600, .6, "lowpass", 150); tone(180, t, .2, "sawtooth", .08, sfxBus, 90); },
    error: t => { tone(160, t, .25, "sawtooth", .12, sfxBus); tone(150, t + .15, .3, "sawtooth", .12, sfxBus); },
    tick: t => tone(1800, t, .03, "square", .05, sfxBus),
    cheer: t => [0, 4, 7, 12].forEach((s, i) => tone(mtof(74 + s), t + i * .09, .3, "square", .07, sfxBus)),
    win: t => [0, 4, 7, 12, 7, 12].forEach((s, i) => tone(mtof(74 + s), t + i * .12, i === 5 ? .7 : .2, "triangle", .14, sfxBus)),
    lose: t => [7, 5, 3, 0].forEach((s, i) => tone(mtof(62 + s), t + i * .16, .3, "triangle", .12, sfxBus)),
    page: t => noise(t, .15, .08, sfxBus, 3000, .7, "bandpass", 1500),
    bell: t => { tone(mtof(57), t, 2.4, "sine", .22, sfxBus); tone(mtof(57) * 2.76, t, 1.4, "sine", .07, sfxBus); tone(mtof(57) * 5.4, t, .6, "sine", .03, sfxBus); },
    note0: t => tone(mtof(72), t, .45, "sine", .2, sfxBus), note1: t => tone(mtof(76), t, .45, "sine", .2, sfxBus),
    note2: t => tone(mtof(79), t, .45, "sine", .2, sfxBus), note3: t => tone(mtof(83), t, .45, "sine", .2, sfxBus)

  return { play, sfx, duck, setOn, unlock, isOn: () => on };

<script>/* =====================================================================

const WORLD = (() => {

  const MOODS = {

    night: { top: 0x0a1233, mid: 0x26407e, low: 0x3a5ea0, fog: 0x1c2c5a, near: 260, far: 760, sea: 0x2a56a8, sun: 0, hemi: [0xcfd9ff, 0x1b1f3b, 1.15], dir: [0xcfe0ff, .85], ghost: .6 }
  };
  let mood = Object.assign({}, MOODS.dusk), moodFrom = null, moodTo = null, moodT = 1, moodDur = 1;

  /* ---------- characters ---------- */
  function kid(shirt, band) {

    box(.24, .2, .32, C.yellow, 0, -.06, .38, head);
    box(.14, .14, .2, C.yellow, 0, -.2, .45, head);
    [-.16, .16].forEach(x => box(.09, .12, .05, glowMat(C.navy), x, .1, .28, head));
    box(.7, .14, .5, glowMat(0x111111), 0, .34, 0, head); box(.36, .2, .3, glowMat(0x111111), 0, .48, 0, head);

  function rowboat(withKids = false) {

    box(1.3, .1, 2.6, C.woodDark, 0, .48, 0, b);

      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, low: { value: new THREE.Color() } },

      const hill = mesh(jitter(new THREE.ConeGeometry(r, h, 7, 1), 2, 11 + i), flat(i % 2 ? 0x1f9a62 : 0x27a86b), x, 1.6 + h / 2, z, isl);
    });

    /* Smugglers' Alley lanterns strung between houses */
    W.alleySpot = new THREE.Vector3(-20, 2, -26);
    for (let i = 0; i < 6; i++) { const l = box(.4, .5, .4, glowMat([C.pink, C.yellow, C.mint][i % 3]), -22 + i * 1.2, 6 - Math.sin(i / 5 * Math.PI) * .8, 23.5, isl); }

    for (let i = 0; i < 12; i++) { const p = box(5.6, .3, 1.35, i % 2 ? C.wood : 0xa0571a, 0, 1, -6 + i * 1.4, hb); p.rotation.x = (i % 3 - 1) * .015; }
    [[-2.7, -5], [2.7, -5], [-2.7, 2], [2.7, 2], [-2.7, 9], [2.7, 9]].forEach(([x, z]) => mesh(new THREE.CylinderGeometry(.3, .3, 3, 6), flat(C.woodDark), x, -.2, z, hb));
    W.lamps = [[-2.7, 1], [2.7, -4.5]].map(([x, z]) => {
      box(.16, 3.2, .16, C.navy, x, 2.6, z, hb);

    for (let i = 0; i < 6; i++) { const f = makeFish(); f.position.set((i % 3) * .5 - .5, Math.floor(i / 3) * .3, (i % 2) * .4); f.rotation.y = i; f.scale.setScalar(.7); W.pile.add(f); }

    W.kidB = kid(C.orange, 0x222222); W.kidB.position.set(1, 1.15, 6.6); hb.add(W.kidB);
    /* Captain Crabbe's fishing boat */
    W.crabBoat = group(8.5, 0, 3);
    box(3, 1.4, 8, C.red, 0, .4, 0, W.crabBoat); box(3.1, .25, 8.1, C.yellow, 0, 1.15, 0, W.crabBoat);

function showPanel(html, build) { const p = $("panel"); p.innerHTML = html; if (build) build(p); p.classList.add("show"); }

function hudFish() { $("ghud").innerHTML = `<span class="chip">🐟 Fish left: ${FISH.left}</span><span class="chip">🛢️ In the barrel: ${FISH.score}</span>`; }
function newFish() {
  const f = WORLD.makeFish(); f.position.set(.55, 2.6, 5.9); f.rotation.y = Math.PI / 2; W.harbour.add(f); FISH.fish = f; FISH.flying = false; FISH.vel = V(0, 0, 0);
  const pf = W.pile.children.find(x => x.visible); if (pf) pf.visible = false;
}
function moveBarrel(instant) {

  const to = V(s[0], s[2] || 1.15, s[1]);

}
function aimVelocity(a) {

  const dy = Math.max(0, Math.min(.5, (a.y - a.sy) / H)), dx = (a.x - a.sx) / H;
  return V(-dx * 16, 4.5 + dy * 15, -(2 + dy * 30));
}
const G = 16;
function fishPointer(type, e) {

  if (type === "down") FISH.aim = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY };

    FISH.vel = v; FISH.flying = true; MUSIC.sfx("whoosh"); $("ghint").classList.remove("show");
    W.kidB.userData.armR.rotation.x = -2.4; tween(.4, k => W.kidB.userData.armR.rotation.x = -2.4 + k * 2.4);
  }
}
function fishTick(dt) {
  if (S.mode !== "game" || !FISH.on || !FISH.fish) return;
  const f = FISH.fish;
  if (FISH.aim && !FISH.flying) {
    const v = aimVelocity(FISH.aim);
    f.position.set(.55 - (FISH.aim.x - FISH.aim.sx) / innerHeight * 1.2, 2.6 - Math.max(0, (FISH.aim.y - FISH.aim.sy) / innerHeight) * 1.5, 5.9 + Math.max(0, (FISH.aim.y - FISH.aim.sy) / innerHeight) * 1.6);
    const show = !S.hard;
    let p = f.position.clone(), vv = v.clone();

  }

    const dx = W.barrel.position.x - f.position.x, dz = W.barrel.position.z - f.position.z, dist = Math.hypot(dx, dz);

  }
  FISH.vel.y -= G * dt; f.position.addScaledVector(FISH.vel, dt);

    f.position.set(bx + (Math.random() - .5) * .6, rim - .3, bz + (Math.random() - .5) * .6); f.rotation.set(Math.random(), Math.random(), 1.2);
    W.barrelFish.push(f); FISH.fish = null; return throwDone();
  }
  const onDock = Math.abs(f.position.x) < 2.9 && f.position.z > -6.8 && f.position.z < 10;

    return throwDone();
  }
}
function throwDone() {

const angOf = v => Math.atan2(v.x - ISLE.x, v.z - ISLE.z);
const ringPt = a => V(ISLE.x + Math.sin(a) * RING, 0, ISLE.z + Math.cos(a) * RING);

  hush(); clearTimeout(autoTimer); hideStory(); clearLabels(); $("mapbar").classList.remove("show"); $("ghud").classList.remove("show"); $("ghint").classList.remove("show"); $("hud").style.display = "none";
  FISH.on = false; if (FISH.fish && FISH.fish.parent) FISH.fish.parent.remove(FISH.fish); FISH.fish = null;
  S.mode = "start"; S.items = []; S.eight = {}; S.hours = 0; S.boatPos = null;
  resetHarbour(); WORLD.setMood("dusk", 1.5); MUSIC.play("shanty");
  CAM.orbit = { c: V(0, 2, 3), r: 20, h: 8, speed: .08 }; CAM.drift = 1;
  const dad = S.narrator === "dad";
  showPanel(`<h1>The Curse of <span class="accent">Captain Grimtide</span></h1><p>Break the curse before midnight!</p>`, p => {
    const pick = el("div", "pick");
    const cards = {};
    [["dad", "🎙️", "Captain Dad", "Dad tells the story. Starring Sonny and Wylie."], ["computer", "🤖", "Robo-Parrot", "The computer reads it. Make your own pirate names."]].forEach(([k, em, t, s]) => {
      const c = el("button", "pickcard"); c.type = "button"; c.setAttribute("aria-pressed", String(S.narrator === k));
      c.append(el("span", "pe", em)); const tx = el("span"); tx.append(el("strong", null, t), el("span", null, s)); c.append(tx);
      c.onclick = () => { S.narrator = k; store.set("narrator", k); showStart(); };
      pick.appendChild(c); cards[k] = c;
    });
    p.appendChild(pick);
    const err = el("div", "err");
    if (!dad) {
      const names = el("div", "names"); const saved = store.get("names", { a: "", b: "" });
      ["a", "b"].forEach((k, i) => { const l = el("label", null, "Pirate " + (i + 1)); const inp = el("input"); inp.id = "n" + k; inp.maxLength = 12; inp.value = saved[k] || ""; inp.placeholder = i ? "Max" : "Sam"; l.appendChild(inp); names.appendChild(l); });
      p.appendChild(names);
    }
    p.appendChild(err);
    const go = el("button", "big", dad ? "Ready, Captain Dad! 🎙️" : "Make us pirates! 🏴‍☠️");
    go.onclick = () => {
      MUSIC.unlock();
      if (dad) { S.a = "Sonny"; S.b = "Wylie"; S.reading = true; store.set("reading", true); syncRead(); return reveal("Sonny", "Wylie", null); }
      const ra = $("na").value.trim().replace(/[^\p{L}\-' ]/gu, ""), rb = $("nb").value.trim().replace(/[^\p{L}\-' ]/gu, "");
      if (!ra || !rb) { err.textContent = "Both pirates need a name!"; return; }
      store.set("names", { a: ra, b: rb }); reveal(ra, rb, 0);
    };
    p.appendChild(go);
  });
}
function reveal(ra, rb, roll) {
  const N = roll === null ? { a: "Sonny", aFull: "Sonny", b: "Wylie", bFull: "Wylie" } : makeNames(ra, rb, roll);
  CAM.orbit = null; shot("kidsClose", 1.8);
  W.kidA.userData.busy = W.kidB.userData.busy = true;
  tween(.5, k => { W.kidA.userData.armL.rotation.z = -k * 2.6; W.kidB.userData.armR.rotation.z = k * 2.6; });
  showPanel(`<h2>Arrr! Meet the crew</h2>
    <div class="pname a"><div class="real">${roll === null ? "In blue" : cap(ra) + " is now..."}</div><div class="pir">${N.aFull}</div></div>
    <div class="pname b"><div class="real">${roll === null ? "In orange" : cap(rb) + " is now..."}</div><div class="pir">${N.bFull}</div></div>`, p => {
    const row = el("div", "row");
    if (roll !== null) { const again = el("button", "big alt", "🎲 New names"); again.onclick = () => reveal(ra, rb, roll + 1); row.appendChild(again); }
    const go = el("button", "big", "Set sail! ⛵");
    go.onclick = () => { S.a = N.a; S.b = N.b; $("panel").classList.remove("show"); tween(.4, k => { W.kidA.userData.armL.rotation.z = -2.6 * (1 - k); W.kidB.userData.armR.rotation.z = 2.6 * (1 - k); }, () => { W.kidA.userData.busy = W.kidB.userData.busy = false; }); goPage("intro1"); };
    row.appendChild(go); p.appendChild(row);
  });
  if (roll === null) playClip("welcome"); else speak("n", cap(ra) + " is now " + N.aFull + ". And " + cap(rb) + " is now " + N.bFull + ". Arrr!");
}

/* =====================================================================
   TOOLBAR, INPUT, MAIN LOOP
   ===================================================================== */
function syncRead() { $("readBtn").setAttribute("aria-pressed", String(S.reading)); $("readBtn").textContent = S.reading ? "🔊 Reading" : "🔈 Read"; }
function syncMusic() { $("musicBtn").setAttribute("aria-pressed", String(S.music)); $("musicBtn").textContent = S.music ? "🎵" : "🔇"; MUSIC.setOn(S.music); }
$("readBtn").onclick = () => { S.reading = !S.reading; store.set("reading", S.reading); syncRead(); if (!S.reading) hush(); };
$("musicBtn").onclick = () => { S.music = !S.music; store.set("music", S.music); syncMusic(); MUSIC.unlock(); };
$("homeBtn").onclick = showStart;
$("next").onclick = e => { e.stopPropagation(); hush(); nextBeat(); };

function boot() {
  if (!window.THREE) { $("loading").textContent = "The 3D world needs an internet connection to load. Check your connection and refresh."; return; }
  WORLD.init($("world"));
  const cv = WORLD.renderer.domElement;
  cv.addEventListener("pointerdown", e => { MUSIC.unlock(); if (S.mode === "game") { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} fishPointer("down", e); } else if (S.mode === "story" && $("next").classList.contains("show")) { hush(); nextBeat(); } });
  cv.addEventListener("pointermove", e => fishPointer("move", e));
  cv.addEventListener("pointerup", e => fishPointer("up", e));
  cv.addEventListener("pointercancel", e => fishPointer("up", e));
  syncRead(); syncMusic();
  resetHarbour();
  WORLD.camera.position.set(0, 30, 60); CAM.look.set(0, 2, 0);
  showStart();
  $("loading").style.display = "none";
  const clock = new THREE.Clock();
  (function loop() {
    const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
    tweensTick(dt); fishTick(dt); WORLD.tick(t, dt); camTick(t, dt); placeBubble(); labelsTick();
    WORLD.render();
    requestAnimationFrame(loop);
  })();
}
boot();
</script>
</body>
</html>
